<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><main>
<section class="tool-card">
<div id="setup"><label>训练条件<select id="preset"></select></label><label id="gridOption" hidden>网格规模<select id="gridSize"><option value="mobile">6×5 · 手机触摸版</option><option value="video">8×10 · 视频规模</option></select></label><p id="condition"></p><p id="gridNote" hidden>80 字模式的手机点击格较小。小屏推荐 6×5；两种条件分别记录和比较。</p></div>
<p id="notice" role="status">准备好后开始。完整规则可通过页面右上角「？」查看。</p><button class="primary" id="start" disabled>开始训练</button>
<div id="play" hidden><div class="tool-stats"><strong id="progress"></strong><span id="stage">准备</span><span id="clock"></span></div><p id="prompt"></p><div id="stimulus"></div><div id="recallForm"><div id="inputs"></div><div class="tool-actions"><button class="primary" id="submit" disabled>提交答案</button><button id="skip" hidden>想不起来 / 跳过</button><button class="primary" id="next" hidden>下一题</button></div></div><p id="feedback" class="feedback" role="status"></p><button id="stop">结束本轮</button></div>
<div id="result" hidden><p>本轮成绩</p><h2 id="resultMain"></h2><p id="resultDetail"></p><p id="saved" role="status"></p><button id="retrySave" hidden>重试保存</button><div class="tool-actions"><button class="primary" id="again">再练一轮</button><button id="home">返回目录</button></div></div>
</section></main><dialog id="rules"><div class="rules-head"><h2>这一项，怎么练？</h2><button id="rulesClose" aria-label="关闭规则">×</button></div><p id="rulesText"></p></dialog></body></html>
