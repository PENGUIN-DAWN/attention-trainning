<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><main><section class="advanced-card">
<div id="setup"><p id="condition"></p><label id="presetLabel" hidden>训练条件<select id="preset"></select></label><p class="evidence-note">专项练习 · 参数为 App 初版设定，训练表现不作为诊断或一般能力评分。</p><button id="teach" hidden>先做教学练习</button></div>
<section id="audioCheck" hidden><h2>先检查耳机声道</h2><p>这是主动有声训练。请使用立体声耳机和舒适音量；系统单声道、外放或声道不明时请退出或重新检测。</p><div class="row"><button id="checkLeft">播放左声道测试</button><button id="checkRight">播放右声道测试</button></div><p id="checkQuestion" role="status">按顺序播放，并如实选择你听到的位置。</p><div id="checkAnswers" class="row" hidden><button data-ear="left">只在左耳</button><button data-ear="right">只在右耳</button><button data-ear="both">两边都有</button><button data-ear="unsure">不确定</button></div><p id="checkStatus" role="status">尚未确认声道。此项由你确认，App 无法检测实际耳机位置。</p><button id="resetCheck">重新检测</button></section>
<p id="notice" role="status">准备好后开始，规则可通过右上角「？」查看。</p><button id="start" class="primary" disabled>开始正式训练</button>
<section id="play" hidden><div class="advanced-stats"><strong id="progress"></strong><span id="stage"></span><span id="clock"></span></div><p id="prompt"></p><div id="stimulus" aria-label="训练刺激区域"></div><div id="answerArea"><div id="choices"></div><div id="fields"></div><button id="submit" class="primary" hidden disabled>提交答案</button><button id="replay" hidden>教学重播</button><button id="next" class="primary" hidden>下一题</button></div><p id="feedback" role="status"></p><button id="stop">结束本轮</button></section>
<section id="result" hidden><p id="resultTitle">本轮记录</p><h2 id="resultMain"></h2><p id="resultDetails"></p><p id="saved" role="status"></p><button id="retrySave" hidden>重试保存</button><div class="row"><button id="again" class="primary">再练一轮</button><button id="home">返回目录</button></div></section>
</section></main><dialog id="rules"><div class="rules-head"><h2>这一项，怎么练？</h2><button id="closeRules" aria-label="关闭规则">×</button></div><p id="rulesText"></p></dialog></body></html>
