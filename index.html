ght:100%;background:#5c8663;width:0;transition:width .2s}.toolbar{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}button,select{font-family:inherit;font-size:14px}.primary,.secondary{padding:13px 19px;border-radius:12px;font-weight:600;cursor:pointer}.primary{background:#315b40;color:white;border:1px solid #315b40;flex:1}.secondary{background:white;color:#52614f;border:1px solid #dbe3d4}.primary:disabled{opacity:.55;cursor:default}.secondary:disabled{opacity:.4;cursor:default}.message{min-height:46px;color:#61715e;font-size:13px;line-height:1.7;margin:16px 0 0}.side h2{font-size:17px;margin:0 0 16px}.side ol{padding-left:21px;color:#647062;font-size:14px;line-height:1.9;margin:0 0 24px}.side li{padding-left:3px;margin-bottom:9px}.side strong{color:#354c39}.mode-label{display:block;font-size:12px;color:#71806d;margin-bottom:9px}select{width:100%;padding:12px;border:1px solid #dbe3d4;border-radius:10px;background:white;color:#354c39;margin-bottom:22px}.result{background:#eff4e9;border-radius:15px;padding:17px;margin-bottom:22px}.result-title{font-size:12px;color:#6b7c63}.result-main{font-size:22px;font-weight:650;line-height:1.6;margin-top:5px}.result-detail{color:#67785f;font-size:13px;line-height:1.7;margin-top:4px}.history{border-top:1px solid #e4e9dd;padding-top:19px}.history h2{margin-bottom:9px}.history p,.record{font-size:13px;color:#74806d;line-height:1.7}.record{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #edf0e7;padding:10px 0}.foot{font-size:12px;color:#85907d;line-height:1.8;margin-top:24px}.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);padding:12px 20px;background:#315b40;color:white;border-radius:12px;pointer-events:none;opacity:0;transition:opacity .15s}.toast.visible{opacity:1}@media(max-width:760px){body{padding:22px 12px}.layout{grid-template-columns:1fr;gap:18px}.board-card,.side{padding:20px;border-radius:20px}h1{font-size:28px}.grid{gap:6px}.metric{font-size:25px}.cell{font-size:29px}header{margin-bottom:20px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\u003cdiv class=\"eyebrow\">ATTENTION PRACTICE · 01\u003c/div>\u003ch1>舒尔特方格\u003c/h1>\u003cp>让目光找到下一个数字。按 1 → 25 的顺序，依次点击。\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003csection class=\"board-card\" aria-label=\"训练区域\">\n\u003cdiv class=\"stats\">\u003cdiv>\u003cspan class=\"label\" id=\"timeLabel\">剩余时间\u003c/span>\u003cspan class=\"metric\" id=\"time\">30.0\u003c/span>\u003cspan> 秒\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">下一个数字\u003c/span>\u003cspan class=\"metric target\" id=\"next\">1\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">点错次数\u003c/span>\u003cspan class=\"metric\" id=\"errors\">0\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"grid\" id=\"grid\" aria-label=\"5乘5数字方格\">\u003c/div>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cspan id=\"progress\">\u003c/span>\u003c/div>\n\u003cdiv class=\"toolbar\">\u003cbutton class=\"primary\" id=\"start\">开始第一轮\u003c/button>\u003cbutton class=\"secondary\" id=\"stop\" disabled>结束本轮\u003c/button>\u003c/div>\n\u003cp class=\"message\" id=\"message\" role=\"status\" aria-live=\"polite\">准备好后点击开始，数字出现时开始计时。\u003c/p>\n\u003c/section>\n\u003caside class=\"side\">\n\u003ch2>这一轮，怎么练？\u003c/h2>\n\u003col>\u003cli>从 \u003cstrong>1\u003c/strong> 开始，按顺序点击，直到 \u003cstrong>25\u003c/strong>。\u003c/li>\u003cli>数字的位置和颜色每轮随机分配。\u003cstrong>忽略颜色，只看数字顺序\u003c/strong>；点错后继续寻找同一个目标。\u003c/li>\u003cli>尽量做到准确、连贯。正确的格子只短暂闪一下，随后恢复。\u003c/li>\u003c/ol>\n\u003clabel class=\"mode-label\" for=\"mode\">训练方式\u003c/label>\u003cselect id=\"mode\">\u003coption value=\"challenge\">30 秒挑战 · 记录找到几个\u003c/option>\u003coption value=\"complete\">完成 25 个 · 记录总用时\u003c/option>\u003c/select>\n\u003cdiv class=\"result\" id=\"result\" hidden aria-live=\"polite\">\u003cdiv class=\"result-title\" id=\"resultTitle\">本轮结果\u003c/div>\u003cdiv class=\"result-main\" id=\"resultMain\">\u003c/div>\u003cdiv class=\"result-detail\" id=\"resultDetail\">\u003c/div>\u003c/div>\n\u003cdiv class=\"history\">\u003ch2>本次练习记录\u003c/h2>\u003cdiv id=\"records\">\u003cp>完成第一轮后，结果会显示在这里。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"foot\">每轮重新打乱 1—25，随机搭配红、蓝、绿、紫、橙五种颜色；本轮内颜色保持固定。\u003cbr>这是一份独立练习，记录仅保留在当前页面。\u003c/div>\n\u003c/aside>\n\u003c/div>\n\u003c/main>\n\u003cdiv class=\"toast\" id=\"toast\" role=\"status\">\u003c/div>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst state={running:false,next:1,errors:0,started:0,frame:0,round:0,mode:'challenge',records:[],generation:0};\nlet toastTimer;\nconst numberColors=['#b33f39','#2c61ae','#287347','#8150a6','#9b6416'];\nfunction shuffled(values=Array.from({length:25},(_,i)=>i+1)){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction makeGrid(values,waiting=false){$('grid').replaceChildren();const colors=shuffled(Array.from({length:values.length},(_,i)=>numberColors[i%numberColors.length]));for(const [index,number] of values.entries()){const cell=document.createElement('button');cell.className='cell'+(waiting?' wait':'');cell.textContent=waiting?'·':String(number);if(!waiting)cell.style.color=colors[index];cell.disabled=true;cell.setAttribute('aria-label',waiting?'等待开始':String(number));cell.addEventListener('click',()=>choose(number,cell));$('grid').appendChild(cell);}}\nfunction elapsed(){return Math.max(0,(performance.now()-state.started)/1000);}\nfunction paint(seconds){$('time').textContent=(state.mode==='challenge'?Math.max(0,30-seconds):seconds).toFixed(1);$('next').textContent=state.next>25?'完成':String(state.next);$('errors').textContent=String(state.errors);$('progress').style.width=((state.next-1)/25*100)+'%';}\nfunction tick(){if(!state.running)return;const seconds=elapsed();paint(seconds);if(state.mode==='challenge'&&seconds>=30){finish('timeout');return;}state.frame=requestAnimationFrame(tick);}\nfunction start(){if(state.running)return;state.mode=$('mode').value;state.generation++;state.next=1;state.errors=0;state.running=true;$('result').hidden=true;$('mode').disabled=true;$('start').disabled=true;$('stop').disabled=false;$('timeLabel').textContent=state.mode==='challenge'?'剩余时间':'已用时间';makeGrid(shuffled());for(const c of $('grid').children)c.disabled=false;$('message').textContent='训练中：从 1 开始，依次点击到 25。';state.started=performance.now();paint(0);state.frame=requestAnimationFrame(tick);}\nfunction choose(number,cell){if(!state.running)return;const seconds=elapsed();if(state.mode==='challenge'&&seconds>=30){finish('timeout');return;}if(number===state.next){state.next++;cell.classList.add('hit');const generation=state.generation;setTimeout(()=>{if(generation===state.generation)cell.classList.remove('hit');},150);paint(seconds);if(state.next===26)finish('complete');}else{state.errors++;cell.classList.add('miss');setTimeout(()=>cell.classList.remove('miss'),180);$('toast').textContent='继续找 '+state.next;clearTimeout(toastTimer);$('toast').classList.add('visible');toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),650);paint(seconds);}}\nfunction finish(reason){if(!state.running)return;const seconds=state.mode==='challenge'?Math.min(30,elapsed()):elapsed();state.running=false;cancelAnimationFrame(state.frame);state.round++;for(const cell of $('grid').children)cell.disabled=true;$('mode').disabled=false;$('start').disabled=false;$('start').textContent='换一张，开始下一轮';$('stop').disabled=true;paint(seconds);const found=state.next-1;const complete=reason==='complete';$('result').hidden=false;$('resultTitle').textContent=reason==='timeout'?'30 秒到，本轮结束':complete?'全部找到，本轮完成':'本轮提前结束';$('resultMain').textContent=complete?seconds.toFixed(1)+' 秒 · 完成 25 个':'找到 '+found+' / 25 个';$('resultDetail').textContent='用时 '+seconds.toFixed(1)+' 秒，点错 '+state.errors+' 次。'+(complete?' 下一轮会使用新的数字排列。':' 下一轮仍从 1 开始。');$('message').textContent=complete?'这一轮已完成。准备好后，可以换一张方格再练。':'本轮已记录。先看清结果，再开始下一轮。';state.records.unshift({round:state.round,found,seconds,errors:state.errors,mode:state.mode,reason});$('records').replaceChildren();for(const record of state.records.slice(0,6)){const row=document.createElement('div');row.className='record';const label=document.createElement('span');label.textContent='第 '+record.round+' 轮 · '+(record.mode==='challenge'?'30 秒':'完成计时')+(record.reason==='stopped'?'（提前结束）':'');const detail=document.createElement('span');detail.textContent=record.found+'/25 · '+record.seconds.toFixed(1)+'秒 · 错'+record.errors;row.append(label,detail);$('records').appendChild(row);}}\n$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>finish('stopped'));$('mode').addEventListener('change',()=>{state.mode=$('mode').value;$('timeLabel').textContent=state.mode==='challenge'?'剩余时间':'已用时间';$('time').textContent=state.mode==='challenge'?'30.0':'0.0';});makeGrid(Array.from({length:25},(_,i)=>i+1),true);\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": 2, "filename": "字色干扰训练.html", "title": "字色干扰", "description": "忽略字的含义，认出真正的颜色。", "short": "忽略字义 · 识别颜色", "ability": "抑制干扰", "accent": "#8564b1", "source": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>字色干扰 · 专注力训练\u003c/title>\n\u003cstyle>\n:root{font-family:Inter,\"Microsoft YaHei\",system-ui,sans-serif;color:#24392f;background:#f3f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:30px 20px}main{max-width:1100px;margin:auto}.eyebrow{color:#5b7563;font-size:12px;letter-spacing:3px;font-weight:700}h1{font-size:32px;letter-spacing:-1px;margin:10px 0}header p{color:#647268;line-height:1.7;margin:0}header{margin-bottom:25px}.layout{display:grid;grid-template-columns:minmax(350px,650px) 1fr;gap:26px;align-items:start}.card,.side{border:1px solid #dde3d7;background:#fffefb;border-radius:24px;padding:24px;box-shadow:0 12px 40px #263e2a06}.sta  0}.feedback.incorrect{color:#a24236}.side h2{font-size:17px;margin:0 0 15px}.side ol{padding-left:20px;color:#647062;font-size:14px;line-height:1.9;margin:0 0 23px}.side li{margin-bottom:9px;padding-left:3px}.side strong{color:#354c39}.example{padding:18px;background:#eff4e9;border-radius:15px;margin-bottom:23px}.example-label{font-size:12px;color:#748269}.example-line{display:flex;align-items:center;gap:14px;margin-top:11px;font-size:14px}.example-word{font-size:34px;background:#1d292b;color:#71a6ff;padding:4px 17px;border-radius:10px}.example p{font-size:12px;color:#718168;line-height:1.7;margin:12px 0 0}.result{background:#eff4e9;padding:18px;border-radius:15px;margin-bottom:23px}.result h2{margin-bottom:6px}.result-main{font-size:25px;font-weight:650;line-height:1.6}.result-detail{font-size:13px;color:#64775b;line-height:1.8;margin-top:6px}.history{border-top:1px solid #e4e9dd;padding-top:19px}.history h2{margin-bottom:9px}.history p,.record{font-size:13px;color:#74806d;line-height:1.8}.record{border-bottom:1px solid #edf0e7;padding:10px 0}.foot{font-size:12px;color:#85907d;line-height:1.8;margin-top:22px}.back{display:inline-block;margin-top:15px;color:#56734f;font-size:13px;text-decoration:none}.back:hover{text-decoration:underline}[hidden]{display:none!important}@media(max-width:810px){body{padding:22px 12px}.layout{grid-template-columns:1fr;gap:18px}.card,.side{padding:20px;border-radius:20px}h1{font-size:28px}.metric{font-size:24px}.grid{gap:5px}.word{font-size:36px}.field{padding:17px 9px}.answer{font-size:16px}.answer kbd{font-size:10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\u003cdiv class=\"eyebrow\">ATTENTION PRACTICE · 02\u003c/div>\u003ch1>字色干扰\u003c/h1>\u003cp>看亮起的字，说出它的颜色。忽略字义，再选择答案。\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003csection class=\"card\" aria-label=\"字色干扰训练区域\">\n\u003cdiv class=\"stats\">\u003cdiv>\u003cspan class=\"label\">当前题目\u003c/span>\u003cspan class=\"metric\" id=\"question\">— / 20\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">已用时间\u003c/span>\u003cspan class=\"metric\" id=\"time\">0.0\u003c/span>\u003cspan> 秒\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">答错\u003c/span>\u003cspan class=\"metric\" id=\"errors\">0\u003c/span>\u003cspan> 题\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003cdiv class=\"field-label\">只回答金色边框内，亮起文字的颜色\u003c/div>\u003cdiv class=\"grid\" id=\"grid\" aria-label=\"20个颜色名称，当前题以边框标记\">\u003c/div>\u003c/div>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cspan id=\"progress\">\u003c/span>\u003c/div>\n\u003cdiv class=\"answer-label\">它实际是什么颜色？点击答案，或按对应数字键。\u003c/div>\n\u003cdiv class=\"answers\" id=\"answers\" role=\"group\" aria-label=\"选择文字实际显示的颜色\">\u003c/div>\n\u003cdiv class=\"toolbar\">\u003cbutton class=\"primary\" id=\"start\">开始第一轮 · 20 题\u003c/button>\u003cbutton class=\"secondary\" id=\"stop\" disabled>结束本轮\u003c/button>\u003c/div>\n\u003cp class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">准备好后点击开始。每题只作答一次，随后自动进入下一题。\u003c/p>\n\u003c/section>\n\u003caside class=\"side\">\n\u003ch2>这一轮，怎么练？\u003c/h2>\n\u003col>\u003cli>从左到右、从上到下，依次回答\u003cstrong>当前亮起的字\u003c/strong>。\u003c/li>\u003cli>先说出它的\u003cstrong>实际颜色\u003c/strong>，再点下方答案。比如蓝色的“白”字，应回答“蓝”。\u003c/li>\u003cli>共 \u003cstrong>20 题\u003c/strong>，每题作答后自动前进；没有单题倒计时，先求准确，再求连贯。\u003c/li>\u003c/ol>\n\u003cdiv class=\"example\" id=\"example\">\u003cdiv class=\"example-label\">开始前，确认一下规则\u003c/div>\u003cdiv class=\"example-line\">\u003cspan class=\"example-word\">白\u003c/span>\u003cspan>正确答案：\u003cstrong>蓝\u003c/strong>\u003c/span>\u003c/div>\u003cp>字义是“白”，但文字实际显示为蓝色。\u003c/p>\u003c/div>\n\u003cdiv class=\"result\" id=\"result\" hidden aria-live=\"polite\">\u003ch2 id=\"resultTitle\">本轮完成\u003c/h2>\u003cdiv class=\"result-main\" id=\"resultMain\">\u003c/div>\u003cdiv class=\"result-detail\" id=\"resultDetail\">\u003c/div>\u003c/div>\n\u003cdiv class=\"history\">\u003ch2>本次练习记录\u003c/h2>\u003cdiv id=\"records\">\u003cp>完成第一轮后，结果会显示在这里。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"foot\">每轮随机生成字义与颜色不一致的题目。按钮位置固定，便于熟悉操作。记录仅保留在当前页面。\u003cbr>这里记录的是按钮或按键作答；说出口的答案由你自行核对。\u003c/div>\n\u003ca class=\"back\" href=\"舒尔特方格训练.html\">← 返回第一项：舒尔特方格\u003c/a>\n\u003c/aside>\n\u003c/div>\n\u003c/main>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst colors=[{name:'红',ink:'#ff7979'},{name:'蓝',ink:'#71a6ff'},{name:'绿',ink:'#78dba5'},{name:'黄',ink:'#ffe271'},{name:'白',ink:'#ffffff'}];\nconst state={running:false,busy:false,index:0,correct:0,errors:0,started:0,itemStarted:0,frame:0,pending:0,generation:0,round:0,items:[],trials:[],records:[]};\nfunction shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction generateItems(){const inks=shuffle(Array.from({length:20},(_,i)=>i%colors.length));return inks.map(ink=>({ink,word:shuffle(colors.map((_,i)=>i).filter(i=>i!==ink))[0]}));}\nfunction setup(){for(let i=0;i\u003c20;i++){const cell=document.createElement('div');cell.className='word empty';cell.textContent='·';$('grid').appendChild(cell);}colors.forEach((color,index)=>{const button=document.createElement('button');button.className='answer';button.disabled=true;button.type='button';button.setAttribute('aria-label',color.name+'色，快捷键'+(index+1));const label=document.createElement('span');label.textContent=color.name;const key=document.createElement('kbd');key.textContent='按 '+(index+1);button.append(label,key);button.addEventListener('click',()=>answer(index));$('answers').appendChild(button);});}\nfunction enableAnswers(enabled){for(const button of $('answers').children)button.disabled=!enabled;}\nfunction paint(){const answered=state.correct+state.errors;$('time').textContent=((performance.now()-state.started)/1000).toFixed(1);$('errors').textContent=String(state.errors);$('progress').style.width=(answered/20*100)+'%';}\nfunction tick(){if(!state.running)return;paint();state.frame=requestAnimationFrame(tick);}\nfunction showQuestion(){if(!state.running)return;for(const [i,cell] of Array.from($('grid').children).entries()){cell.className='word'+(i===state.index?' active':i\u003cstate.index?' done':'');cell.style.color=i===state.index?colors[state.items[i].ink].ink:'';}state.busy=false;$('question').textContent=(state.index+1)+' / 20';state.itemStarted=performance.now();enableAnswers(true);}\nfunction start(){if(state.running)return;clearTimeout(state.pending);state.generation++;state.running=true;state.busy=false;state.index=0;state.correct=0;state.errors=0;state.trials=[];state.items=generateItems();$('start').disabled=true;$('stop').disabled=false;$('example').hidden=true;$('result').hidden=true;$('feedback').className='feedback';$('feedback').textContent='忽略字义，回答当前亮起文字的实际颜色。';for(const [i,cell] of Array.from($('grid').children).entries())cell.textContent=colors[state.items[i].word].name;state.started=performance.now();showQuestion();paint();state.frame=requestAnimationFrame(tick);}\nfunction answer(selected){if(!state.running||state.busy||!Number.isInteger(selected)||selected\u003c0||selected>=colors.length)return;state.busy=true;enableAnswers(false);const item=state.items[state.index];const correct=selected===item.ink;const seconds=(performance.now()-state.itemStarted)/1000;state.trials.push({correct,seconds});if(correct)state.correct++;else state.errors++;$('feedback').className=correct?'feedback':'feedback incorrect';$('feedback').textContent=correct?'正确，继续。':'这题的实际颜色是“'+colors[item.ink].name+'”。下一题继续看颜色。';paint();const generation=state.generation;state.pending=setTimeout(()=>{if(!state.running||generation!==state.generation)return;state.index++;if(state.index===20){finish('complete');return;}showQuestion();},correct?250:850);}\nfunction finish(reason){if(!state.running)return;const ended=performance.now();state.running=false;state.busy=false;clearTimeout(state.pending);cancelAnimationFrame(state.frame);enableAnswers(false);state.round++;$('start').disabled=false;$('start').textContent='换一组，开始下一轮';$('stop').disabled=true;paint();const answered=state.correct+state.errors;const accuracy=answered?Math.round(state.correct/answered*100):0;const total=(ended-state.started)/1000;const average=answered?state.trials.reduce((sum,t)=>sum+t.seconds,0)/answered:0;const completed=reason==='complete';$('question').textContent=answered+' / 20';$('result').hidden=false;$('resultTitle').textContent=completed?'本轮完成':'本轮提前结束';$('resultMain').textContent='答对 '+state.correct+' / '+answered+' 题';$('resultDetail').textContent=answered?'正确率 '+accuracy+'%；答错 '+state.errors+' 题。总用时 '+total.toFixed(1)+' 秒，平均作答 '+average.toFixed(2)+' 秒/题（不含题间反馈）。'+(completed?'':'尚有 '+(20-answered)+' 题未作答。'):'本轮尚未作答。';$('feedback').className='feedback';$('feedback').textContent=completed?'20 题已完成。看看正确率和作答时间，再开始下一轮。':'本轮已结束。准备好后，可以重新开始一组。';for(const cell of $('grid').children){cell.className='word done';cell.style.color='';}state.records.unshift({round:state.round,correct:state.correct,answered,errors:state.errors,total,average,completed});$('records').replaceChildren();for(const record of state.records.slice(0,6)){const row=document.createElement('div');row.className='record';row.textContent='第 '+record.round+' 轮'+(record.completed?'':'（提前结束）')+' · 对 '+record.correct+'/'+record.answered+' · 错 '+record.errors+' · '+record.total.toFixed(1)+' 秒';$('records').appendChild(row);}}\n$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>finish('stopped'));document.addEventListener('keydown',event=>{if(event.repeat||event.isComposing||event.ctrlKey||event.altKey||event.metaKey)return;if(state.running&&/^[1-5]$/.test(event.key)){event.preventDefault();answer(Number(event.key)-1);}});setup();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": 3, "filename": "数字大小干扰训练.html", "title": "数字大小干扰", "description": "四个数字，按照数值重新排队。", "s 10px;top:8px;font-size:18px;color:#a9d2b7}.number.wrong{border-color:#ed9483;background:#563a36}.number:disabled{cursor:default}.number.waiting{color:#70807a}button:focus-visible,a:focus-visible{outline:3px solid #bd954a;outline-offset:3px}.sequence{display:flex;gap:10px;align-items:center;justify-content:center;margin:22px 0 0;color:#778571}.sequence-slot{display:flex;align-items:center;justify-content:center;width:50px;height:43px;background:#eff4e9;border:1px solid #dce5d4;border-radius:10px;font-size:22px;font-weight:600;color:#496747}.sequence-label{font-size:12px;margin-right:3px}.progress{height:5px;background:#e9eee4;border-radius:9px;margin-top:20px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#5c8663;transition:width .15s}.toolbar{display:flex;gap:10px;margin-top:20px}button{font-family:inherit;font-size:14px}.primary,.secondary{padding:13px 18px;border-radius:12px;font-weight:600;cursor:pointer}.primary{background:#315b40;color:white;border:1px solid #315b40;flex:1}.secondary{background:white;color:#52614f;border:1px solid #dbe3d4}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}.feedback{min-height:47px;font-size:14px;line-height:1.7;color:#61715e;margin:14px 0 0}.feedback.incorrect{color:#a24236}.side h2{font-size:17px;margin:0 0 15px}.side ol{padding-left:20px;color:#647062;font-size:14px;line-height:1.9;margin:0 0 23px}.side li{margin-bottom:9px;padding-left:3px}.side strong{color:#354c39}.example,.result{padding:18px;background:#eff4e9;border-radius:15px;margin-bottom:23px}.example-label{font-size:12px;color:#748269}.example-numbers{display:flex;justify-content:space-around;align-items:center;background:#1d292b;color:#fff;border-radius:12px;margin:13px 0;padding:12px 10px;height:110px}.example p{font-size:13px;color:#718168;line-height:1.7;margin:0}.result h2{margin-bottom:6px}.result-main{font-size:24px;font-weight:650;line-height:1.6}.result-detail{font-size:13px;color:#64775b;line-height:1.8;margin-top:6px}.history{border-top:1px solid #e4e9dd;padding-top:19px}.history h2{margin-bottom:9px}.history p,.record{font-size:13px;color:#74806d;line-height:1.8}.record{border-bottom:1px solid #edf0e7;padding:10px 0}.foot{font-size:12px;color:#85907d;line-height:1.8;margin-top:22px}.links{display:flex;gap:14px;flex-wrap:wrap;margin-top:15px}.links a{color:#56734f;font-size:13px;text-decoration:none}.links a:hover{text-decoration:underline}[hidden]{display:none!important}@media(max-width:810px){body{padding:22px 12px}.layout{grid-template-columns:1fr;gap:18px}.card,.side{padding:20px;border-radius:20px}h1{font-size:28px}.metric{font-size:24px}.numbers{gap:7px}.field{padding:18px 10px}.number{height:190px}.sequence{gap:7px}.sequence-slot{width:42px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}\n.numbers{grid-template-columns:repeat(4,minmax(0,1fr))}.sequence{flex-wrap:wrap}.sequence-label{flex-basis:100%;text-align:center;margin:0}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\u003cdiv class=\"eyebrow\">ATTENTION PRACTICE · 03\u003c/div>\u003ch1>数字大小干扰\u003c/h1>\u003cp>忽略字体大小，按数值从小到大，依次点击四个数字。\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003csection class=\"card\" aria-label=\"数字大小干扰训练区域\">\n\u003cdiv class=\"stats\">\u003cdiv>\u003cspan class=\"label\">当前题目\u003c/span>\u003cspan class=\"metric\" id=\"question\">— / 20\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">已用时间\u003c/span>\u003cspan class=\"metric\" id=\"time\">0.0\u003c/span>\u003cspan> 秒\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">点错次数\u003c/span>\u003cspan class=\"metric\" id=\"errors\">0\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003cdiv class=\"field-label\" id=\"prompt\">每题四个数字，只看数值，忽略字号\u003c/div>\u003cdiv class=\"numbers\" id=\"numbers\" role=\"group\" aria-label=\"按数值从小到大依次选择\">\u003c/div>\u003c/div>\n\u003cdiv class=\"sequence\" aria-label=\"已选择的排序\">\u003cspan class=\"sequence-label\">你的排序\u003c/span>\u003cspan class=\"sequence-slot\" id=\"slot0\">—\u003c/span>\u003cspan>→\u003c/span>\u003cspan class=\"sequence-slot\" id=\"slot1\">—\u003c/span>\u003cspan>→\u003c/span>\u003cspan class=\"sequence-slot\" id=\"slot2\">—\u003c/span>\u003cspan>→\u003c/span>\u003cspan class=\"sequence-slot\" id=\"slot3\">—\u003c/span>\u003c/div>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cspan id=\"progress\">\u003c/span>\u003c/div>\n\u003cdiv class=\"toolbar\">\u003cbutton class=\"primary\" id=\"start\">开始第一轮 · 20 题\u003c/button>\u003cbutton class=\"secondary\" id=\"stop\" disabled>结束本轮\u003c/button>\u003c/div>\n\u003cp class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">准备好后点击开始。可点击数字，也可用 1、2、3、4 键选择从左到右的四个位置。\u003c/p>\n\u003c/section>\n\u003caside class=\"side\">\n\u003ch2>这一轮，怎么练？\u003c/h2>\n\u003col>\u003cli>每题显示 \u003cstrong>4 个不同数字\u003c/strong>，它们的字体大小不一致。\u003c/li>\u003cli>按\u003cstrong>数值从小到大\u003c/strong>依次点击。点错会提示，继续选择当前应选的数字。\u003c/li>\u003cli>四个都选对后自动进入下一题。一轮共 \u003cstrong>20 题\u003c/strong>，先保证顺序准确，再提高速度。\u003c/li>\u003c/ol>\n\u003cdiv class=\"example\" id=\"example\">\u003cdiv class=\"example-label\">例题：7 写得最大，也要排在 8 前面\u003c/div>\u003cdiv class=\"example-numbers\">\u003cspan style=\"font-size:30px\">8\u003c/span>\u003cspan style=\"font-size:42px\">1\u003c/span>\u003cspan style=\"font-size:76px\">7\u003c/span>\u003cspan style=\"font-size:57px\">4\u003c/span>\u003c/div>\u003cp>正确顺序：\u003cstrong>1 → 4 → 7 → 8\u003c/strong>\u003cbr>注意数值关系，忽略字体大小。\u003c/p>\u003c/div>\n\u003cdiv class=\"result\" id=\"result\" hidden aria-live=\"polite\">\u003ch2 id=\"resultTitle\">本轮完成\u003c/h2>\u003cdiv class=\"result-main\" id=\"resultMain\">\u003c/div>\u003cdiv class=\"result-detail\" id=\"resultDetail\">\u003c/div>\u003c/div>\n\u003cdiv class=\"history\">\u003ch2>本次练习记录\u003c/h2>\u003cdiv id=\"records\">\u003cp>完成第一轮后，结果会显示在这里。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"foot\">每题从 1—9 中随机选四个不同数字，字号顺序与数值顺序存在冲突。每轮重新出题，记录仅保留在当前页面。\u003cbr>“一次排对”指这道题全程没有点错；平均每题用时不包含题间反馈。\u003c/div>\n\u003cnav class=\"links\" aria-label=\"其他训练\">\u003ca href=\"舒尔特方格训练.html\">第一项：舒尔特方格\u003c/a>\u003ca href=\"字色干扰训练.html\">第二项：字色干扰\u003c/a>\u003c/nav>\n\u003c/aside>\n\u003c/div>\n\u003c/main>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst fontSizes=[28,44,60,76];\nconst digitCount=fontSizes.length;\nconst state={running:false,busy:false,index:0,completed:0,perfect:0,errors:0,picked:[],questionErrors:0,started:0,itemStarted:0,frame:0,pending:0,generation:0,round:0,items:[],trials:[],records:[]};\nfunction shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction generateItem(){const values=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,digitCount);const sorted=[...values].sort((a,b)=>a-b);const ranks=values.map(value=>sorted.indexOf(value));let sizeRanks=shuffle([0,1,2,3]);if(sizeRanks.every((rank,i)=>rank===ranks[i]))[sizeRanks[0],sizeRanks[1]]=[sizeRanks[1],sizeRanks[0]];const sizes=sizeRanks.map(rank=>fontSizes[rank]);return {values,sorted,sizes};}\nfunction setup(){for(let i=0;i\u003cdigitCount;i++){const button=document.createElement('button');button.type='button';button.className='number waiting';button.disabled=true;const digit=document.createElement('span');digit.className='digit';digit.style.fontSize='60px';digit.textContent='·';const key=document.createElement('kbd');key.textContent='按 '+(i+1);const check=document.createElement('span');check.className='check';check.textContent='✓';check.hidden=true;button.append(digit,key,check);button.addEventListener('click',()=>choose(i));$('numbers').appendChild(button);}}\nfunction paint(){const seconds=Math.max(0,(performance.now()-state.started)/1000);$('time').textContent=seconds.toFixed(1);$('errors').textContent=String(state.errors);$('progress').style.width=(state.completed/20*100)+'%';}\nfunction tick(){if(!state.running)return;paint();state.frame=requestAnimationFrame(tick);}\nfunction showQuestion(){state.busy=false;state.picked=[];state.questionErrors=0;const item=state.items[state.index];$('question').textContent=(state.index+1)+' / 20';$('prompt').textContent='先选数值最小的数字';for(let i=0;i\u003cdigitCount;i++){const button=$('numbers').children[i];button.className='number';button.disabled=false;button.children[0].textContent=String(item.values[i]);button.children[0].style.fontSize=item.sizes[i]+'px';button.children[2].hidden=true;button.setAttribute('aria-label',String(item.values[i])+'，从左第'+(i+1)+'位，快捷键'+(i+1));$('slot'+i).textContent='—';}$('feedback').className='feedback';$('feedback').textContent='忽略字号，按数值从小到大依次点击。';state.itemStarted=performance.now();}\nfunction start(){if(state.running)return;clearTimeout(state.pending);state.generation++;state.running=true;state.busy=false;state.index=0;state.completed=0;state.perfect=0;state.errors=0;state.trials=[];state.items=Array.from({length:20},generateItem);$('start').disabled=true;$('stop').disabled=false;$('example').hidden=true;$('result').hidden=true;state.started=performance.now();showQuestion();paint();state.frame=requestAnimationFrame(tick);}\nfunction choose(position){if(!state.running||state.busy||!Number.isInteger(position)||position\u003c0||position>=digitCount||state.picked.includes(position))return;const item=state.items[state.index];const button=$('numbers').children[position];const expected=item.sorted[state.picked.length];if(item.values[position]!==expected){state.errors++;state.questionErrors++;button.className='number wrong';$('feedback').className='feedback incorrect';$('feedback').textContent='顺序不对。忽略字号，继续找剩余数字中数值最小的。';paint();const generation=state.generation;const index=state.index;setTimeout(()=>{if(generation===state.generation&&index===state.index&&state.running&&!state.picked.includes(position))button.className='number';},450);return;}state.picked.push(position);button.disabled=true;button.className='number picked';button.children[2].hidden=false;$('slot'+(state.picked.length-1)).textContent=String(item.values[position]);$('feedback').className='feedback';if(state.picked.length\u003cdigitCount){$('prompt').textContent=state.picked.length===digitCount-1?'最后选择剩下的数字':'再选剩余数字中数值最小的';$('feedback').textContent='正确，继续按数值从小到大选择。';paint();return;}state.busy=true;state.completed++;if(state.questionErrors===0)state.perfect++;state.trials.push({seconds:(performance.now()-state.itemStarted)/1000,errors:state.questionErrors});$('prompt').textContent='本题排序完成';$('feedback').textContent='排序正确：'+item.sorted.join(' → ');paint();const generation=state.generation;state.pending=setTimeout(()=>{if(!state.running||generation!==state.generation)return;state.index++;if(state.index===20){finish('complete');return;}showQuestion();},400);}\nfunction finish(reason){if(!state.running)return;state.running=false;state.busy=false;clearTimeout(state.pending);cancelAnimationFrame(state.frame);state.round++;for(const button of $('numbers').children)button.disabled=true;$('start').disabled=false;$('start').textContent='换一组，开始下一轮';$('stop').disabled=true;paint();const total=Math.max(0,(performance.now()-state.started)/1000);const accuracy=state.completed?Math.round(state.perfect/state.completed*100):0;const average=state.completed?state.trials.reduce((sum,t)=>sum+t.seconds,0)/state.completed:0;const completed=reason==='complete'||state.completed===20;$('question').textContent=state.completed+' / 20';$('result').hidden=false;$('resultTitle').textContent=completed?'本轮完成':'本轮提前结束';$('resultMain').textContent='一次排对 '+state.perfect+' / '+state.completed+' 题';$('resultDetail').textContent='已完成 '+state.completed+' / 20 题；一次排对率 '+accuracy+'%；点错 '+state.errors+' 次（含未完成题）。总用时 '+total.toFixed(1)+' 秒。'+(state.completed?'平均每道完成题用时 '+average.toFixed(2)+' 秒。':'');$('prompt').textContent=completed?'20 题已完成':'本轮已结束';$('feedback').className='feedback';$('feedback').textContent='查看结果，准备好后再开始下一轮。';state.records.unshift({round:state.round,completed:state.completed,perfect:state.perfect,errors:state.errors,total,average,finished:completed});$('records').replaceChildren();for(const record of state.records.slice(0,6)){const row=document.createElement('div');row.className='record';row.textContent='第 '+record.round+' 轮'+(record.finished?'':'（提前结束）')+' · 完成 '+record.completed+'/20 · 一次排对 '+record.perfect+' 题 · 错 '+record.errors+' 次 · '+record.total.toFixed(1)+' 秒';$('records').appendChild(row);}}\n$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>finish('stopped'));document.addEventListener('keydown',event=>{if(event.repeat||event.isComposing||event.ctrlKey||event.altKey||event.metaKey)return;if(state.running&&/^[1-4]$/.test(event.key)){event.preventDefault();choose(Number(event.key)-1);}});setup();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": 4, "filename": "六项序列记忆训练.html", "title": "六项序列记忆", "description": "记住六个小伙伴，和它们的出场顺序。", "short": "六个图案 · 顺序回忆", "ability": "序列记忆", "accent": "#b26b87", "source": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>六项序列记忆 · 专注力训练\u003c/title>\n\u003cstyle>\n:root{font-family:Inter,\"Microsoft YaHei\",system-ui,sans-serif;color:#24392f;background:#f3f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:30px 20px}main{max-width:1100px;margin:auto}header{margin-bottom:25px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:700;color:#5b7563}h1{font-size:32px;letter-spacing:-1px;margin:10px 0}header p{color:#647268;line-height:1.7;margin:0}.layout{display:grid;grid-template-columns:minmax(350px,650px) 1fr;gap:26px;align-items:start}.card,.side{background:#fffefb;border:1px solid #dde3d7;border-radius:24px;padding:24px;box-shadow:0 12px 40px #263e2a06}.stats{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}.label{display:block;font-size:12px;color:#738174;margin-bottom:6px}.metric{font-size:2 ground:#eaf0e3}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.primary,.secondary{padding:12px 17px;border-radius:12px;font-weight:600;cursor:pointer}.primary{background:#315b40;border:1px solid #315b40;color:white;flex:1}.secondary{background:white;color:#52614f;border:1px solid #dbe3d4}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #bd954a;outline-offset:3px}.feedback{min-height:44px;color:#61715e;font-size:13px;line-height:1.7;margin:14px 0 0}.side h2{font-size:17px;margin:0 0 15px}.side ol{font-size:14px;color:#647062;line-height:1.9;padding-left:20px;margin:0 0 22px}.side li{padding-left:3px;margin-bottom:9px}.side strong{color:#354c39}.settings{background:#f2f5ec;border-radius:15px;padding:16px;margin-bottom:22px}.settings label{display:block;font-size:12px;color:#71806a;margin-bottom:8px}select{width:100%;background:white;color:#354c39;border:1px solid #dbe3d4;border-radius:10px;padding:10px;margin-bottom:15px}.settings select:last-child{margin-bottom:0}.result{background:#eff4e9;border-radius:15px;padding:17px;margin-bottom:22px}.result h2{margin-bottom:5px}.result-main{font-size:25px;font-weight:650;line-height:1.6}.result-detail{font-size:13px;color:#64775b;line-height:1.8;margin-top:5px}.compare{margin-top:20px;border-top:1px solid #e4e9dd;padding-top:16px}.compare h2{font-size:15px;margin:0 0 10px}.comparison{width:100%;border-collapse:collapse;font-size:13px;text-align:left}.comparison th{font-weight:500;color:#7c8873}.comparison td,.comparison th{padding:9px 4px;border-bottom:1px solid #edf0e7}.comparison .right{color:#386d44}.comparison .wrong{color:#a24236}.history{border-top:1px solid #e4e9dd;padding-top:18px}.history h2{margin-bottom:8px}.history p,.record{font-size:13px;line-height:1.8;color:#74806d}.record{border-bottom:1px solid #edf0e7;padding:9px 0}.foot{font-size:12px;color:#85907d;line-height:1.8;margin-top:21px}.links{display:flex;flex-wrap:wrap;gap:13px;margin-top:15px}.links a{font-size:12px;text-decoration:none;color:#56734f}.links a:hover{text-decoration:underline}[hidden]{display:none!important}@media(max-width:810px){body{padding:22px 12px}.layout{grid-template-columns:1fr;gap:18px}.card,.side{padding:20px;border-radius:20px}h1{font-size:28px}.metric{font-size:21px}.sequence{gap:4px}.slot{padding:6px 1px}.slot-icon{font-size:24px}.slot-name{font-size:10px}.choice{gap:5px}.choice-icon{font-size:27px}.toolbar{gap:7px}.primary,.secondary{padding:11px 13px}}@media(max-width:390px){.sequence{grid-template-columns:repeat(3,minmax(0,1fr))}.slot{min-height:75px}.slot-name{font-size:11px}.choice{flex-direction:column;gap:2px;font-size:12px}.stage{height:210px}.stage.compact{height:135px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\u003cdiv class=\"eyebrow\">ATTENTION PRACTICE · 04\u003c/div>\u003ch1>六项序列记忆\u003c/h1>\u003cp>记住六个物品或动物，展示结束后，按原顺序把它们选出来。\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003csection class=\"card\" aria-label=\"六项序列记忆训练区域\">\n\u003cdiv class=\"stats\">\u003cdiv>\u003cspan class=\"label\">当前阶段\u003c/span>\u003cspan class=\"metric\" id=\"phase\">准备\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">本组长度\u003c/span>\u003cspan class=\"metric\">6 项\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">回忆用时\u003c/span>\u003cspan class=\"metric\" id=\"time\">0.0\u003c/span>\u003cspan> 秒\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"steps\" aria-hidden=\"true\">\u003cspan id=\"step0\" class=\"active\">准备\u003c/span>\u003cspan>→\u003c/span>\u003cspan id=\"step1\">记忆\u003c/span>\u003cspan>→\u003c/span>\u003cspan id=\"step2\">回忆\u003c/span>\u003cspan>→\u003c/span>\u003cspan id=\"step3\">核对\u003c/span>\u003c/div>\n\u003cdiv class=\"stage\" id=\"stage\" aria-live=\"polite\">\u003cdiv class=\"stage-icon\" id=\"stageIcon\">🧠\u003c/div>\u003cdiv class=\"stage-name\" id=\"stageName\">准备记住 6 项\u003c/div>\u003cdiv class=\"stage-caption\" id=\"stageCaption\">每次只展示一项，注意它的出现位置。\u003c/div>\u003c/div>\n\u003cdiv class=\"dots\" id=\"dots\" aria-hidden=\"true\">\u003c/div>\n\u003cdiv id=\"recall\" hidden>\u003cdiv class=\"recall-label\">你的回忆顺序 · 选满 6 项后提交\u003c/div>\u003cdiv class=\"sequence\" id=\"sequence\" aria-label=\"你选择的六项顺序\">\u003c/div>\u003cdiv class=\"recall-label\">按记忆中的先后顺序，依次选择\u003c/div>\u003cdiv class=\"choices\" id=\"choices\" role=\"group\" aria-label=\"六个待排序的物品或动物\">\u003c/div>\u003cdiv class=\"toolbar\">\u003cbutton class=\"secondary\" id=\"undo\" disabled>撤销上一项\u003c/button>\u003cbutton class=\"secondary\" id=\"clear\" disabled>清空重选\u003c/button>\u003cbutton class=\"primary\" id=\"submit\" disabled>提交顺序\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"toolbar\">\u003cbutton class=\"primary\" id=\"start\">开始第 1 组 · 6 项\u003c/button>\u003cbutton class=\"secondary\" id=\"stop\" disabled>放弃本组\u003c/button>\u003c/div>\n\u003cp class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">默认每项展示 1.5 秒，随后短暂留白。准备好后点击开始。\u003c/p>\n\u003csection class=\"compare\" id=\"compare\" hidden aria-label=\"顺序核对结果\">\u003ch2>逐项核对\u003c/h2>\u003ctable class=\"comparison\">\u003cthead>\u003ctr>\u003cth>位置\u003c/th>\u003cth>原顺序\u003c/th>\u003cth>你的顺序\u003c/th>\u003cth>结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"comparisonBody\">\u003c/tbody>\u003c/table>\u003c/section>\n\u003c/section>\n\u003caside class=\"side\">\n\u003ch2>这一组，怎么练？\u003c/h2>\n\u003col>\u003cli>倒数结束后，依次展示 \u003cstrong>6 个不同的物品或动物\u003c/strong>，记住它们及出现顺序。\u003c/li>\u003cli>全部消失后，从重新打乱的六个选项中，按\u003cstrong>最先出现 → 最后出现\u003c/strong>依次选择。\u003c/li>\u003cli>可以撤销或重选。\u003cstrong>提交后才公布答案\u003c/strong>，每个位置分别计分。\u003c/li>\u003c/ol>\n\u003cdiv class=\"settings\">\u003clabel for=\"category\">本组内容\u003c/label>\u003cselect id=\"category\">\u003coption value=\"mixed\">物品和动物混合\u003c/option>\u003coption value=\"animals\">只练动物\u003c/option>\u003coption value=\"objects\">只练物品\u003c/option>\u003c/select>\u003clabel for=\"speed\">每项展示时间\u003c/label>\u003cselect id=\"speed\">\u003coption value=\"2000\">2 秒 · 慢一些\u003c/option>\u003coption value=\"1500\" selected>1.5 秒 · 标准\u003c/option>\u003coption value=\"1000\">1 秒 · 快一些\u003c/option>\u003c/select>\u003c/div>\n\u003cdiv class=\"result\" id=\"result\" hidden aria-live=\"polite\">\u003ch2 id=\"resultTitle\">本组结果\u003c/h2>\u003cdiv class=\"result-main\" id=\"resultMain\">\u003c/div>\u003cdiv class=\"result-detail\" id=\"resultDetail\">\u003c/div>\u003c/div>\n\u003cdiv class=\"history\">\u003ch2>本次练习记录\u003c/h2>\u003cdiv id=\"records\">\u003cp>提交第一组后，结果会显示在这里。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"foot\">每组固定 6 项，图案与名称同时呈现。混合模式包含 3 个动物和 3 个物品。\u003cbr>成绩按“物品与位置同时正确”计分；回忆用时从六个选项出现起计算。记录仅保留在当前页面。\u003c/div>\n\u003cnav class=\"links\" aria-label=\"其他训练\">\u003ca href=\"舒尔特方格训练.html\">第一项\u003c/a>\u003ca href=\"字色干扰训练.html\">第二项\u003c/a>\u003ca href=\"数字大小干扰训练.html\">第三项\u003c/a>\u003c/nav>\n\u003c/aside>\n\u003c/div>\n\u003c/main>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst animals=[['猫','🐱'],['狗','🐶'],['兔子','🐰'],['老虎','🐯'],['狮子','🦁'],['大象','🐘'],['熊猫','🐼'],['青蛙','🐸'],['猴子','🐵'],['企鹅','🐧'],['蝴蝶','🦋'],['乌龟','🐢']].map(([name,icon],i)=>({id:'a'+i,name,icon}));\nconst objects=[['雨伞','☂️'],['钥匙','🔑'],['书本','📘'],['闹钟','⏰'],['吉他','🎸'],['足球','⚽'],['气球','🎈'],['剪刀','✂️'],['铅笔','✏️'],['杯子','☕'],['苹果','🍎'],['汽车','🚗']].map(([name,icon],i)=>({id:'o'+i,name,icon}));\nconst state={phase:'idle',generation:0,pending:0,frame:0,items:[],options:[],picks:[],index:0,count:3,recallStarted:0,round:0,records:[],category:'mixed',duration:1500};\nfunction shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction generateSequence(category){return category==='animals'?shuffle(animals).slice(0,6):category==='objects'?shuffle(objects).slice(0,6):shuffle([...shuffle(animals).slice(0,3),...shuffle(objects).slice(0,3)]);}\nfunction later(milliseconds,callback){clearTimeout(state.pending);const generation=state.generation;state.pending=setTimeout(()=>{if(generation===state.generation)callback();},milliseconds);}\nfunction setPhase(phase,label,step){state.phase=phase;$('phase').textContent=label;for(let i=0;i\u003c4;i++)$('step'+i).className=i===step?'active':'';}\nfunction setStage(icon,name,caption,compact=false){$('stage').className='stage'+(compact?' compact':'');$('stageIcon').textContent=icon;$('stageName').textContent=name;$('stageCaption').textContent=caption;}\nfunction settingsDisabled(disabled){$('category').disabled=disabled;$('speed').disabled=disabled;}\nfunction drawDots(index=-1){for(let i=0;i\u003c6;i++)$('dots').children[i].className='dot'+(i===index?' current':i\u003cindex?' seen':'');}\nfunction setup(){for(let i=0;i\u003c6;i++){const dot=document.createElement('span');dot.className='dot';$('dots').appendChild(dot);const slot=document.createElement('div');slot.className='slot';const number=document.createElement('div');number.className='slot-number';number.textContent=String(i+1);const icon=document.createElement('div');icon.className='slot-icon';icon.textContent='—';const name=document.createElement('div');name.className='slot-name';slot.append(number,icon,name);$('sequence').appendChild(slot);}}\nfunction start(){if(!['idle','result'].includes(state.phase))return;clearTimeout(state.pending);cancelAnimationFrame(state.frame);state.generation++;state.category=$('category').value;state.duration=Number($('speed').value);state.items=generateSequence(state.category);state.options=[];state.picks=[];state.index=0;state.count=3;$('recall').hidden=true;$('compare').hidden=true;$('result').hidden=true;$('choices').replaceChildren();$('comparisonBody').replaceChildren();$('time').textContent='0.0';$('start').disabled=true;$('stop').disabled=false;settingsDisabled(true);drawDots();setPhase('countdown','倒数',0);$('feedback').textContent='专心看中央画面，记住每一项和它出现的顺序。';countdown();}\nfunction countdown(){setStage(String(state.count),'准备记忆','即将依次展示 6 项');later(1000,()=>{state.count--;if(state.count>0)countdown();else showItem(0);});}\nfunction showItem(index){state.index=index;setPhase('memorize','记忆中',1);const item=state.items[index];setStage(item.icon,item.name,'第 '+(index+1)+' / 6 项');drawDots(index);later(state.duration,()=>{setPhase('gap','记忆中',1);setStage('','',index===5?'展示结束，准备回忆':'记住刚才这一项的顺序');later(300,()=>{if(index\u003c5)showItem(index+1);else beginRecall();});});}\nfunction beginRecall(){setPhase('recall','回忆中',2);setStage('↗','按原顺序选择','从最先出现的那一项开始。',true);drawDots(6);state.options=shuffle(state.items);if(state.options.every((item,i)=>item.id===state.items[i].id))state.options.push(state.options.shift());$('choices').replaceChildren();for(const item of state.options){const button=document.createElement('button');button.className='choice';button.type='button';button.setAttribute('aria-label',item.name);const icon=document.createElement('span');icon.className='choice-icon';icon.textContent=item.icon;const name=document.createElement('span');name.textContent=item.name;button.append(icon,name);button.addEventListener('click',()=>pick(item.id));$('choices').appendChild(button);}$('recall').hidden=false;$('feedback').textContent='先选最早出现的，再依次往后选。全部选好后提交，过程中不提示对错。';renderPicks();state.recallStarted=performance.now();tick();}\nfunction renderPicks(){for(let i=0;i\u003c6;i++){const slot=$('sequence').children[i];const item=state.picks[i]?state.items.find(item=>item.id===state.picks[i]):null;slot.children[1].textContent=item?item.icon:'—';slot.children[2].textContent=item?item.name:'';}for(let i=0;i\u003cstate.options.length;i++){const selected=state.picks.includes(state.options[i].id);const button=$('choices').children[i];button.disabled=selected||state.phase!=='recall';button.className='choice'+(selected?' selected':'');}$('undo').disabled=state.phase!=='recall'||state.picks.length===0;$('clear').disabled=$('undo').disabled;$('submit').disabled=state.phase!=='recall'||state.picks.length!==6;}\nfunction pick(id){if(state.phase!=='recall'||state.picks.length>=6||state.picks.includes(id)||!state.items.some(item=>item.id===id))return;state.picks.push(id);renderPicks();}\nfunction undo(){if(state.phase!=='recall')return;state.picks.pop();renderPicks();}\nfunction clearPicks(){if(state.phase!=='recall')return;state.picks=[];renderPicks();}\nfunction tick(){if(state.phase!=='recall')return;$('time').textContent=Math.max(0,(performance.now()-state.recallStarted)/1000).toFixed(1);state.frame=requestAnimationFrame(tick);}\nfunction submit(){if(state.phase!=='recall'||state.picks.length!==6)return;const seconds=Math.max(0,(performance.now()-state.recallStarted)/1000);cancelAnimationFrame(state.frame);clearTimeout(state.pending);setPhase('result','核对结果',3);state.round++;const correct=state.items.reduce((sum,item,i)=>sum+Number(item.id===state.picks[i]),0);setStage(correct===6?'✓':'↔',correct===6?'顺序全部正确':'看看哪些位置记反了','下方可以逐项核对原顺序和你的顺序。',true);$('time').textContent=seconds.toFixed(1);$('result').hidden=false;$('resultMain').textContent='位置记对 '+correct+' / 6 项';$('resultDetail').textContent=(correct===6?'完整序列回忆成功。':'本组位置正确率 '+Math.round(correct/6*100)+'%。')+'回忆用时 '+seconds.toFixed(1)+' 秒。';$('feedback').textContent='本组已记录。核对完后，可以换一组六项继续练。';$('stop').disabled=true;$('start').disabled=false;$('start').textContent='开始第 '+(state.round+1)+' 组 · 6 项';settingsDisabled(false);renderPicks();$('comparisonBody').replaceChildren();for(let i=0;i\u003c6;i++){const expected=state.items[i];const chosen=state.items.find(item=>item.id===state.picks[i]);const row=document.createElement('tr');for(const text of [String(i+1),expected.icon+' '+expected.name,chosen.icon+' '+chosen.name,expected.id===chosen.id?'✓ 正确':'顺序有误']){const cell=document.createElement('td');cell.textContent=text;row.appendChild(cell);}row.children[3].className=expected.id===chosen.id?'right':'wrong';$('comparisonBody').appendChild(row);}$('compare').hidden=false;state.records.unshift({round:state.round,correct,seconds,category:state.category,duration:state.duration});$('records').replaceChildren();const labels={mixed:'混合',animals:'动物',objects:'物品'};for(const record of state.records.slice(0,6)){const row=document.createElement('div');row.className='record';row.textContent='第 '+record.round+' 组 · '+labels[record.category]+' · 每项 '+record.duration/1000+' 秒 · 记对 '+record.correct+'/6 · 回忆 '+record.seconds.toFixed(1)+' 秒';$('records').appendChild(row);}}\nfunction abort(message='本组已放弃，没有计入成绩。准备好后可以重新开始。'){if(['idle','result'].includes(state.phase))return;state.generation++;clearTimeout(state.pending);cancelAnimationFrame(state.frame);setPhase('idle','准备',0);state.picks=[];state.options=[];state.items=[];$('recall').hidden=true;$('choices').replaceChildren();$('compare').hidden=true;$('start').disabled=false;$('start').textContent='重新开始 · 6 项';$('stop').disabled=true;$('time').textContent='0.0';settingsDisabled(false);drawDots();setStage('🧠','准备记住 6 项','每次只展示一项，注意它的出现位置。');$('feedback').textContent=message;}\n$('start').addEventListener('click',start);$('stop').addEventListener('click',()=>abort());$('undo').addEventListener('click',undo);$('clear').addEventListener('click',clearPicks);$('submit').addEventListener('click',submit);document.addEventListener('visibilitychange',()=>{if(document.hidden&&['countdown','memorize','gap'].includes(state.phase))abort('刚才离开了页面，本组展示已中断且未计分。请回到页面后重新开始。');});setup();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": 5, "filename": "视觉动态感知训练.html", "title": "视觉动态感知", "description": "看见实际的变化，不被文字带走。", "short": "四种变化 · 动态识别", "ability": "动态感知", "accent": "#5b7db5", "source": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>视觉动态感知 · 专注力训练\u003c/title>\n\u003cstyle>\n:root{font-family:Inter,\"Microsoft YaHei\",system-ui,sans-serif;color:#24392f;background:#f3f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:30px 20px}main{max-width:1100px;margin:auto}header{margin-bottom:25px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:700;color:#5b7563}h1{font-size:32px;letter-spacing:-1px;margin:10px 0}header p{color:#647268;line-height:1.7;margin:0}.layout{display:grid;grid-template-columns:minmax(350px,650px) 1fr;gap:26px;align-items:start}.card,.side{background:#fffefb;border:1px solid #dde3d7;border-radius:24px;padding:24px;box-shadow:0 12px 40px #263e2a06}.stats{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}.label{display:block;font-size:12px;color:#738174;margin-bottom:6px}.metric{font-size:25px;font-weight:650;font-variant-numeric:tabular-nums}.field{border-radius:18px;background:#1d292b;padding:18px 15px;color:#fff}.field-label{text-align:center;color:#c3ceca;font-size:13px;min-height:20px}.viewport{height:270px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.word{font-family:\"Microsoft YaHei\",system-ui,sans-serif;font-size:clamp(48px,8vw,66px);font-weight:650;line-height:1.3;white-space:nowrap;transform-origin:center;will-change:transform;user-select:none}.placeholder{font-size:16px;color:#90a59b;text-align:center;line-height:1.8}.observation{height:4px;border-radius:6px;background:#3a4d46;overflow:hidden}.observation span{height:100%;display:block;background:#cfbc83;width:0}.field-caption{min-height:19px;font-size:12px;color:#91a59b;text-align:center;margin-top:13px}.answer-label{font-size:13px;color:#6d7a67;margin:18px 0 10px}.answers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}button{font-family:inherit;font-size:15px;touch-action:manipulation}.answer{border:1px solid #dbe3d4;background:#fffefb;border-radius:12px;padding:13px 4px;color:#354c39;font-weight:650;cursor:pointer}.answer kbd{display:block;font-family:inherit;font-size:11px;font-weight:400;color:#83907b;margin-top:5px}.answer:not(:disabled):hover{background:#eaf0e3}.answer:disabled{opacity:.45;cursor:default}.progress{height:5px;background:#e9eee4;border-radius:9px;margin-top:19px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#5c8663;transition:width .15s}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.primary,.secondary{padding:12px 17px;border-radius:12px;font-weight:600;cursor:pointer}.primary{background:#315b40;border:1px solid #315b40;color:white;flex:1}.secondary{background:white;color:#52614f;border:1px solid #dbe3d4}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #bd954a;outline-offset:3px}.feedback{min-height:47px;color:#61715e;font-size:14px;line-height:1.7;margin:14px 0 0}.feedback.incorrect{color:#a24236}.side h2{font-size:17px;margin:0 0 15px}.side ol{font-size:14px;color:#647062;line-height:1.9;padding-left:20px;margin:0 0 22px}.side li{padding-left:3px;margin-bottom:9px}.side strong{color:#354c39}.example,.result{background:#eff4e9;border-radius:15px;padding:17px;margin-bottom:22px}.example-label{font-size:12px;color:#748269}.example p{font-size:14px;line-height:1.9;color:#64775b;margin:9px 0 0}.result h2{margin-bottom:5px}.result-main{font-size:24px;font-weight:650;line-height:1.6}.result-detail{font-size:13px;color:#64775b;line-height:1.8;margin-top:6px}.history{border-top:1px solid #e4e9dd;padding-top:18px}.history h2{margin-bottom:8px}.history p,.record{font-size:13px;line-height:1.8;color:#74806d}.record{border-bottom:1px solid #edf0e7;padding:9px 0}.foot{font-size:12px;color:#85907d;line-height:1.8;margin-top:21px}.links{display:flex;flex-wrap:wrap;gap:13px;margin-top:15px}.links a{font-size:12px;text-decoration:none;color:#56734f}.links a:hover{text-decoration:underline}[hidden]{display:none!important}@media(max-width:810px){body{padding:22px 12px}.layout{grid-template-columns:1fr;gap:18px}.card,.side{padding:20px;border-radius:20px}h1{font-size:28px}.metric{font-size:23px}.viewport{height:240px}.answers{gap:6px}.answer{font-size:14px}.toolbar{gap:7px}.primary,.secondary{padding:11px 13px}}@media(prefers-reduced-motion:reduce){.progress span{transition:none}}\n.settings{background:#f2f5ec;border-radius:15px;padding:17px;margin-bottom:22px}.duration-heading{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:#64775b}.duration-heading output{font-size:20px;font-weight:650;color:#315b40;font-variant-numeric:tabular-nums}.settings input{display:block;width:100%;margin:17px 0 9px;accent-color:#426c4d;cursor:pointer}.settings input:disabled{cursor:default;opacity:.55}.range-labels{display:flex;justify-content:space-between;font-size:11px;color:#829077}.settings p{font-size:12px;line-height:1.7;color:#798770;margin:12px 0 0}.settings input:focus-visible{outline:3px solid #bd954a;outline-offset:4px}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\u003cdiv class=\"eyebrow\">ATTENTION PRACTICE · 05\u003c/div>\u003ch1>视觉动态感知\u003c/h1>\u003cp>忽略文字含义，判断字体实际在变大、变小、静止，还是旋转。\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003csection class=\"card\" aria-label=\"视觉动态感知训练区域\">\n\u003cdiv class=\"stats\">\u003cdiv>\u003cspan class=\"label\">当前题目\u003c/span>\u003cspan class=\"metric\" id=\"question\">— / 20\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">已用时间\u003c/span>\u003cspan class=\"metric\" id=\"time\">0.0\u003c/span>\u003cspan> 秒\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">答错\u003c/span>\u003cspan class=\"metric\" id=\"errors\">0\u003c/span>\u003cspan> 题\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003cdiv class=\"field-label\" id=\"phaseLabel\">准备观察实际变化\u003c/div>\u003cdiv class=\"viewport\">\u003cdiv class=\"placeholder\" id=\"placeholder\">点击开始，观察一段变化\u003c/div>\u003cdiv class=\"word\" id=\"word\" hidden>\u003c/div>\u003c/div>\u003cdiv class=\"observation\" aria-hidden=\"true\">\u003cspan id=\"observationProgress\">\u003c/span>\u003c/div>\u003cdiv class=\"field-caption\" id=\"caption\">每题先观察 1.6 秒，再作答。\u003c/div>\u003c/div>\n\u003cdiv class=\"answer-label\">刚才字体实际怎样变化？点击答案，或按对应数字键。\u003c/div>\n\u003cdiv class=\"answers\" id=\"answers\" role=\"group\" aria-label=\"选择实际观察到的变化\">\u003c/div>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cspan id=\"progress\">\u003c/span>\u003c/div>\n\u003cdiv class=\"toolbar\">\u003cbutton class=\"primary\" id=\"start\">开始第一轮 · 20 题\u003c/button>\u003cbutton class=\"secondary\" id=\"replay\" disabled>重播本题\u003c/button>\u003cbutton class=\"secondary\" id=\"stop\" disabled>结束本轮\u003c/button>\u003c/div>\n\u003cp class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">准备好后点击开始。观察过程中暂不作答，播放结束后选择刚才的变化。\u003c/p>\n\u003c/section>\n\u003caside class=\"side\">\n\u003ch2>这一轮，怎么练？\u003c/h2>\n\u003col>\u003cli>每题先观察 \u003cstrong id=\"instructionDuration\">1.6 秒\u003c/strong>，字体会变大、变小、静止或旋转。\u003c/li>\u003cli>\u003cstrong>忽略文字写的内容\u003c/strong>，按你刚才看到的实际变化选择答案。\u003c/li>\u003cli>一轮共 \u003cstrong>20 题\u003c/strong>，每题作答一次后自动前进。没看清可点“重播本题”。\u003c/li>\u003c/ol>\n\u003cdiv class=\"settings\">\u003cdiv class=\"duration-heading\">\u003clabel for=\"observationDuration\">每题观察时间\u003c/label>\u003coutput id=\"durationValue\" for=\"observationDuration\">1.6 秒\u003c/output>\u003c/div>\u003cinput id=\"observationDuration\" type=\"range\" min=\"1\" max=\"2\" step=\"0.1\" value=\"1.6\" aria-valuetext=\"1.6 秒\">\u003cdiv class=\"range-labels\">\u003cspan>1 秒 · 快\u003c/span>\u003cspan>2 秒 · 慢\u003c/span>\u003c/div>\u003cp>开始前调整，步长 0.1 秒；本轮内固定，重播也使用同一时长。\u003c/p>\u003c/div>\n\u003cdiv class=\"example\">\u003cdiv class=\"example-label\">先确认规则\u003c/div>\u003cp>文字写着“变小”，它却越来越大。\u003cbr>此时应选：\u003cstrong>变大\u003c/strong>。\u003c/p>\u003cp>播放结束后字体会停住；判断的是\u003cstrong>刚才整段过程\u003c/strong>，并非结束后的状态。\u003c/p>\u003c/div>\n\u003cdiv class=\"result\" id=\"result\" hidden aria-live=\"polite\">\u003ch2 id=\"resultTitle\">本轮结果\u003c/h2>\u003cdiv class=\"result-main\" id=\"resultMain\">\u003c/div>\u003cdiv class=\"result-detail\" id=\"resultDetail\">\u003c/div>\u003c/div>\n\u003cdiv class=\"history\">\u003ch2>本次练习记录\u003c/h2>\u003cdiv id=\"records\">\u003cp>完成第一轮后，结果会显示在这里。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"foot\">每轮四种实际变化各 5 题；文字含义与实际变化始终不同。缩放只朝一个方向进行，旋转会顺时针转一整圈。\u003cbr>平均作答用时从首次观察结束算起，包含重播时间。记录仅保留在当前页面。\u003c/div>\n\u003cnav class=\"links\" aria-label=\"其他训练\">\u003ca href=\"舒尔特方格训练.html\">第一项\u003c/a>\u003ca href=\"字色干扰训练.html\">第二项\u003c/a>\u003ca href=\"数字大小干扰训练.html\">第三项\u003c/a>\u003ca href=\"六项序列记忆训练.html\">第四项\u003c/a>\u003c/nav>\n\u003c/aside>\n\u003c/div>\n\u003c/main>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst actions=['变大','变小','静止','旋转'];\nconst state={running:false,observationMs:1600,phase:'idle',index:0,correct:0,errors:0,replays:0,started:0,observationStarted:0,readyStarted:null,frame:0,pending:0,generation:0,round:0,items:[],trials:[],records:[]};\nfunction readObservationMs(){const seconds=Number($('observationDuration').value);return Number.isFinite(seconds)?Math.round(Math.min(2,Math.max(1,seconds))*10)*100:1600;}\nfunction updateObservationDuration(){if(state.running)return;const milliseconds=readObservationMs();const seconds=(milliseconds/1000).toFixed(1);$('observationDuration').value=seconds;$('observationDuration').setAttribute('aria-valuetext',seconds+' 秒');$('durationValue').textContent=seconds+' 秒';$('instructionDuration').textContent=seconds+' 秒';if(state.phase==='idle')$('caption').textContent='每题先观察 '+seconds+' 秒，再作答。';}\nfunction shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction generateItems(){return shuffle(Array.from({length:20},(_,i)=>i%4)).map(motion=>({motion,word:shuffle([0,1,2,3].filter(i=>i!==motion))[0]}));}\nfunction motionTransform(motion,progress){const p=Math.min(1,Math.max(0,progress));if(motion===0)return 'scale('+(0.6+0.7*p).toFixed(4)+')';if(motion===1)return 'scale('+(1.3-0.7*p).toFixed(4)+')';if(motion===3)return 'rotate('+(360*p).toFixed(2)+'deg)';return 'scale(1)';}\nfunction setup(){actions.forEach((action,index)=>{const button=document.createElement('button');button.type='button';button.className='answer';button.disabled=true;button.setAttribute('aria-label',action+'，快捷键'+(index+1));const label=document.createElement('span');label.textContent=action;const key=document.createElement('kbd');key.textContent='按 '+(index+1);button.append(label,key);button.addEventListener('click',()=>answer(index));$('answers').appendChild(button);});}\nfunction enableAnswers(enabled){for(const button of $('answers').children)button.disabled=!enabled;$('replay').disabled=!enabled;}\nfunction paintStats(){const answered=state.correct+state.errors;$('time').textContent=Math.max(0,(performance.now()-state.started)/1000).toFixed(1);$('errors').textContent=String(state.errors);$('progress').style.width=(answered/20*100)+'%';}\nfunction later(delay,callback){clearTimeout(state.pending);const generation=state.generation;state.pending=setTimeout(()=>{if(state.running&&generation===state.generation)callback();},delay);}\nfunction prepareQuestion(){state.phase='prepare';state.readyStarted=null;enableAnswers(false);$('question').textContent=(state.index+1)+' / 20';$('word').hidden=true;$('placeholder').hidden=false;$('placeholder').textContent='准备观察';$('phaseLabel').textContent='下一段变化即将开始';$('caption').textContent='注意完整过程，不要照着文字读。';$('observationProgress').style.width='0%';$('feedback').className='feedback';$('feedback').textContent='先观察，再判断实际变化。';later(350,()=>playObservation(false));}\nfunction playObservation(replay){if(!state.running)return;if(replay){if(state.phase!=='ready')return;state.replays++;}state.phase='observing';enableAnswers(false);const item=state.items[state.index];$('placeholder').hidden=true;$('word').hidden=false;$('word').textContent=actions[item.word];$('word').style.transform=motionTransform(item.motion,0);$('observationProgress').style.width='0%';$('phaseLabel').textContent=replay?'重播中 · 观察实际变化':'观察中 · 观察实际变化';$('caption').textContent='完整观察后再选择答案。';$('feedback').className='feedback';$('feedback').textContent='忽略字义，留意字体实际怎样变化。';state.observationStarted=performance.now();}\nfunction tick(){if(!state.running)return;const now=performance.now();paintStats();if(state.phase==='observing'){const progress=Math.min(1,Math.max(0,(now-state.observationStarted)/state.observationMs));$('word').style.transform=motionTransform(state.items[state.index].motion,progress);$('observationProgress').style.width=(progress*100)+'%';if(progress>=1){state.phase='ready';if(state.readyStarted===null)state.readyStarted=now;$('phaseLabel').textContent='请作答 · 刚才实际怎样变化？';$('caption').textContent='画面已停住，请回想刚才的完整过程。';$('feedback').textContent='请选择实际变化。没看清可以重播。';enableAnswers(true);}}state.frame=requestAnimationFrame(tick);}\nfunction start(){if(state.running)return;clearTimeout(state.pending);cancelAnimationFrame(state.frame);state.generation++;state.observationMs=readObservationMs();state.running=true;$('observationDuration').disabled=true;state.index=0;state.correct=0;state.errors=0;state.replays=0;state.trials=[];state.items=generateItems();state.started=performance.now();$('start').disabled=true;$('stop').disabled=false;$('result').hidden=true;prepareQuestion();paintStats();state.frame=requestAnimationFrame(tick);}\nfunction answer(selected){if(!state.running||state.phase!=='ready'||!Number.isInteger(selected)||selected\u003c0||selected>3)return;const item=state.items[state.index];const correct=selected===item.motion;const seconds=Math.max(0,(performance.now()-state.readyStarted)/1000);state.phase='feedback';enableAnswers(false);state.trials.push({correct,seconds});if(correct)state.correct++;else state.errors++;$('phaseLabel').textContent=correct?'回答正确':'本题已作答';$('feedback').className=correct?'feedback':'feedback incorrect';$('feedback').textContent=correct?'正确，下一题继续观察实际变化。':'刚才的实际变化是“'+actions[item.motion]+'”。下一题继续看变化。';paintStats();later(correct?350:1000,()=>{state.index++;if(state.index===20){finish('complete');return;}prepareQuestion();});}\nfunction finish(reason){if(!state.running)return;state.running=false;state.phase='result';$('observationDuration').disabled=false;clearTimeout(state.pending);cancelAnimationFrame(state.frame);enableAnswers(false);state.round++;$('start').disabled=false;$('start').textContent='换一组，开始下一轮';$('stop').disabled=true;paintStats();const answered=state.correct+state.errors;const accuracy=answered?Math.round(state.correct/answered*100):0;const seconds=Math.max(0,(performance.now()-state.started)/1000);const average=answered?state.trials.reduce((sum,t)=>sum+t.seconds,0)/answered:0;const completed=reason==='complete'||answered===20;$('question').textContent=answered+' / 20';$('word').hidden=true;$('placeholder').hidden=false;$('placeholder').textContent=completed?'20 题已完成':'本轮已结束';$('phaseLabel').textContent=completed?'本轮完成':'本轮提前结束';$('caption').textContent='查看本轮结果，准备好后再练一轮。';$('result').hidden=false;$('resultTitle').textContent=completed?'本轮完成':reason==='interrupted'?'离开页面，本轮中断':'本轮提前结束';$('resultMain').textContent='答对 '+state.correct+' / '+answered+' 题';$('resultDetail').textContent='每题观察 '+(state.observationMs/1000).toFixed(1)+' 秒。'+(answered?'正确率 '+accuracy+'%；答错 '+state.errors+' 题。总用时 '+seconds.toFixed(1)+' 秒；平均作答 '+average.toFixed(2)+' 秒/题；重播 '+state.replays+' 次。'+(completed?'':'尚有 '+(20-answered)+' 题未作答。'):'尚未作答；本轮未生成正确率。');$('feedback').className='feedback';$('feedback').textContent=reason==='interrupted'?'刚才离开了页面，本轮已停止。已作答部分保留在记录中，回到页面后可以重新开始。':'本轮已记录。先看正确率，再比较作答时间。';state.records.unshift({round:state.round,correct:state.correct,answered,errors:state.errors,seconds,average,replays:state.replays,observationMs:state.observationMs,completed});$('records').replaceChildren();for(const record of state.records.slice(0,6)){const row=document.createElement('div');row.className='record';row.textContent='第 '+record.round+' 轮'+(record.completed?'':'（未完成）')+' · 观察 '+(record.observationMs/1000).toFixed(1)+' 秒 · 对 '+record.correct+'/'+record.answered+' · 错 '+record.errors+' · 重播 '+record.replays+' 次 · '+record.seconds.toFixed(1)+' 秒';$('records').appendChild(row);}}\n$('observationDuration').addEventListener('input',updateObservationDuration);$('start').addEventListener('click',start);$('replay').addEventListener('click',()=>playObservation(true));$('stop').addEventListener('click',()=>finish('stopped'));document.addEventListener('keydown',event=>{if(event.repeat||event.isComposing||event.ctrlKey||event.altKey||event.metaKey)return;if(state.running&&/^[1-4]$/.test(event.key)){event.preventDefault();answer(Number(event.key)-1);}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.running)finish('interrupted');});setup();updateObservationDuration();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"}, {"id": 6, "filename": "视觉完形整合训练.html", "title": "视觉完形整合", "description": "把分散的部件，拼回完整的汉字。", "short": "分开的部件 · 完整汉字", "ability": "整体识别", "accent": "#ac854a", "source": "\u003c!doctype html>\n\u003chtml lang=\"zh-CN\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>视觉完形整合 · 专注力训练\u003c/title>\n\u003cstyle>\n:root{font-family:Inter,\"Microsoft YaHei\",system-ui,sans-serif;color:#24392f;background:#f3f5ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0;padding:30px 20px}main{max-width:1100px;margin:auto}header{margin-bottom:25px}.eyebrow{font-size:12px;letter-spacing:3px;font-weight:700;color:#5b7563}h1{font-size:32px;letter-spacing:-1px;margin:10px 0}header p{color:#647268;line-height:1.7;margin:0}.layout{display:grid;grid-template-columns:minmax(350px,650px) 1fr;gap:26px;align-items:start}.card,.side{background:#fffefb;border:1px solid #dde3d7;border-radius:24px;padding:24px;box-shadow:0 12px 40px #263e2a06}.stats{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}.label{display:block;font-size:12px;color:#738174;margin-bottom:6px}.metric{font-size:25px;font-weight:650;font-variant-numeric:tabular-nums}.field{background:#1d292b;color:#fff;border-radius:18px;padding:18px 15px}.field-label{font-size:13px;text-align:center;min-height:20px;color:#b7c7bc}.display{height:270px;display:flex;align-items:center;justify-content:center}.parts{display:flex;align-items:center;justify-content:center;gap:clamp(35px,9vw,115px);width:100%;user-select:none}.part{font-family:\"Microsoft YaHei\",\"SimSun\",serif;font-size:clamp(61px,9vw,85px);font-weight:500;line-height:1.2;min-width:1em;text-align:center}.parts.vertical{flex-direction:column;gap:27px}.parts.vertical .part{font-size:67px}.whole{font-size:116px;font-family:\"Microsoft YaHei\",\"SimSun\",serif;line-height:1.2}.placeholder{font-size:16px;color:#90a59b;line-height:1.8;text-align:center}.field-caption{min-height:19px;font-size:12px;color:#91a59b;text-align:center;margin-top:12px}.answer-form{margin-top:20px}.answer-form label{display:block;font-size:13px;color:#6d7a67;margin-bottom:10px}.input-row{display:flex;gap:9px}input{min-width:0;flex:1;border:1px solid #dbe3d4;background:white;border-radius:12px;padding:12px 15px;font:22px \"Microsoft YaHei\",system-ui,sans-serif;color:#354c39;text-align:center}input::placeholder{font-size:14px;color:#99a18f}input:disabled{background:#f2f5eb;color:#748268}button{font-family:inherit;font-size:14px;touch-action:manipulation}.primary,.secondary{padding:12px 17px;border-radius:12px;font-weight:600;cursor:pointer}.primary{background:#315b40;border:1px solid #315b40;color:white}.secondary{background:white;color:#52614f;border:1px solid #dbe3d4}.primary:disabled,.secondary:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #bd954a;outline-offset:3px}.progress{height:5px;background:#e9eee4;border-radius:9px;margin-top:19px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:#5c8663;transition:width .15s}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.toolbar .primary{flex:1}.feedback{min-height:47px;color:#61715e;font-size:14px;line-height:1.7;margin:14px 0 0}.feedback.incorrect{color:#a24236}.side h2{font-size:17px;margin:0 0 15px}.side ol{font-size:14px;color:#647062;line-height:1.9;padding-left:20px;margin:0 0 22px}.side li{padding-left:3px;margin-bottom:9px}.side strong{color:#354c39}.example,.result{background:#eff4e9;border-radius:15px;padding:17px;margin-bottom:22px}.example-label{font-size:12px;color:#748269}.example-chars{font-size:27px;letter-spacing:5px;margin:14px 0;color:#354c39}.example p{font-size:13px;line-height:1.8;color:#64775b;margin:0}.result h2{margin-bottom:5px}.result-main{font-size:24px;font-weight:650;line-height:1.6}.result-detail{font-size:13px;color:#64775b;line-height:1.8;margin-top:6px}.history{border-top:1px solid #e4e9dd;padding-top:18px}.history h2{margin-bottom:8px}.history p,.record{font-size:13px;line-height:1.8;color:#74806d}.record{border-bottom:1px solid #edf0e7;padding:9px 0}.review{border-top:1px solid #e4e9dd;padding-top:17px;margin-top:19px}.review h2{font-size:16px;margin:0 0 10px}table{width:100%;border-collapse:collapse;font-size:13px;text-align:left}th{font-weight:500;color:#7c8873}th,td{padding:10px 4px;border-bottom:1px solid #edf0e7}.foot{font-size:12px;color:#85907d;line-height:1.8;margin-top:21px}.links{display:flex;flex-wrap:wrap;gap:13px;margin-top:15px}.links a{font-size:12px;text-decoration:none;color:#56734f}.links a:hover{text-decoration:underline}[hidden]{display:none!important}@media(max-width:810px){body{padding:22px 12px}.layout{grid-template-columns:1fr;gap:18px}.card,.side{padding:20px;border-radius:20px}h1{font-size:28px}.metric{font-size:23px}.display{height:250px}.parts{gap:36px}.parts.vertical{gap:23px}.parts.vertical .part{font-size:62px}.toolbar{gap:7px}.primary,.secondary{padding:11px 13px}}@media(prefers-reduced-motion:reduce){.progress span{transition:none}}\n@media(max-width:600px){.input-row{flex-wrap:wrap}.input-row input{flex-basis:100%}.input-row button{flex:1}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cmain>\n\u003cheader>\u003cdiv class=\"eyebrow\">ATTENTION PRACTICE · 06\u003c/div>\u003ch1>视觉完形整合\u003c/h1>\u003cp>观察分开的汉字部件，在脑中合成完整汉字，再输入你的答案。\u003c/p>\u003c/header>\n\u003cdiv class=\"layout\">\n\u003csection class=\"card\" aria-label=\"视觉完形整合训练区域\">\n\u003cdiv class=\"stats\">\u003cdiv>\u003cspan class=\"label\">当前题目\u003c/span>\u003cspan class=\"metric\" id=\"question\">— / 20\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">已用时间\u003c/span>\u003cspan class=\"metric\" id=\"time\">0.0\u003c/span>\u003cspan> 秒\u003c/span>\u003c/div>\u003cdiv>\u003cspan class=\"label\">答对\u003c/span>\u003cspan class=\"metric\" id=\"correct\">0\u003c/span>\u003cspan> 题\u003c/span>\u003c/div>\u003c/div>\n\u003cdiv class=\"field\">\u003cdiv class=\"field-label\" id=\"fieldLabel\">观察部件，合成一个汉字\u003c/div>\u003cdiv class=\"display\">\u003cdiv class=\"placeholder\" id=\"placeholder\">点击开始，查看分开的部件\u003c/div>\u003cdiv class=\"parts\" id=\"parts\" hidden>\u003cspan class=\"part\" id=\"part0\">\u003c/span>\u003cspan class=\"part\" id=\"part1\">\u003c/span>\u003c/div>\u003cdiv class=\"whole\" id=\"whole\" hidden>\u003c/div>\u003c/div>\u003cdiv class=\"field-caption\" id=\"caption\">保持画面中的左右或上下顺序，在脑中组合。\u003c/div>\u003c/div>\n\u003cdiv class=\"answer-form\">\u003clabel for=\"answerInput\">你认出的完整汉字\u003c/label>\u003cdiv class=\"input-row\">\u003cinput id=\"answerInput\" type=\"text\" placeholder=\"输入一个汉字\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" disabled aria-describedby=\"feedback\">\u003cbutton class=\"primary\" id=\"submit\" disabled>提交答案\u003c/button>\u003cbutton class=\"secondary\" id=\"skip\" disabled>暂时想不出\u003c/button>\u003c/div>\u003c/div>\n\u003cdiv class=\"progress\" aria-hidden=\"true\">\u003cspan id=\"progress\">\u003c/span>\u003c/div>\n\u003cdiv class=\"toolbar\">\u003cbutton class=\"primary\" id=\"start\">开始第一轮 · 20 题\u003c/button>\u003cbutton class=\"primary\" id=\"next\" hidden>下一题\u003c/button>\u003cbutton class=\"secondary\" id=\"stop\" disabled>结束本轮\u003c/button>\u003c/div>\n\u003cp class=\"feedback\" id=\"feedback\" role=\"status\" aria-live=\"polite\">先在心里说出完整汉字，再输入确认。每题提交后才显示答案。\u003c/p>\n\u003csection class=\"review\" id=\"review\" hidden>\u003ch2>本轮错题与跳过题\u003c/h2>\u003ctable>\u003cthead>\u003ctr>\u003cth>部件\u003c/th>\u003cth>你的答案\u003c/th>\u003cth>正确汉字\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody id=\"reviewBody\">\u003c/tbody>\u003c/table>\u003c/section>\n\u003c/section>\n\u003caside class=\"side\">\n\u003ch2>这一轮，怎么练？\u003c/h2>\n\u003col>\u003cli>观察分开的两个部件，保持画面中的\u003cstrong>左右或上下位置关系\u003c/strong>。\u003c/li>\u003cli>在脑中把它们合成完整汉字，输入\u003cstrong>一个汉字\u003c/strong>，再点“提交答案”。\u003c/li>\u003cli>核对后点击“下一题”。一轮 \u003cstrong>20 题\u003c/strong>；想不出可以跳过，最后统一回看。\u003c/li>\u003c/ol>\n\u003cdiv class=\"example\">\u003cdiv class=\"example-label\">例题 · 左右组合\u003c/div>\u003cdiv class=\"example-chars\">女 ＋ 子 → 好\u003c/div>\u003cp>先认出两个局部，再把它们当作一个整体。\u003c/p>\u003c/div>\n\u003cdiv class=\"result\" id=\"result\" hidden aria-live=\"polite\">\u003ch2 id=\"resultTitle\">本轮结果\u003c/h2>\u003cdiv class=\"result-main\" id=\"resultMain\">\u003c/div>\u003cdiv class=\"result-detail\" id=\"resultDetail\">\u003c/div>\u003c/div>\n\u003cdiv class=\"history\">\u003ch2>本次练习记录\u003c/h2>\u003cdiv id=\"records\">\u003cp>完成第一轮后，结果会显示在这里。\u003c/p>\u003c/div>\u003c/div>\n\u003cdiv class=\"foot\">每轮随机抽取 10 道左右结构、10 道上下结构题，20 个汉字不重复。部件会一直保留到提交答案。\u003cbr>输入法选字时按回车不会直接判题。作答用时包含辨认与输入时间；核对答案的时间不计入平均作答用时。记录仅保留在当前页面。\u003c/div>\n\u003cnav class=\"links\" aria-label=\"其他训练\">\u003ca href=\"舒尔特方格训练.html\">第一项\u003c/a>\u003ca href=\"字色干扰训练.html\">第二项\u003c/a>\u003ca href=\"数字大小干扰训练.html\">第三项\u003c/a>\u003ca href=\"六项序列记忆训练.html\">第四项\u003c/a>\u003ca href=\"视觉动态感知训练.html\">第五项\u003c/a>\u003c/nav>\n\u003c/aside>\n\u003c/div>\n\u003c/main>\n\u003cscript>\n'use strict';\nconst $=id=>document.getElementById(id);\nconst leftRight=[['好','女','子'],['江','氵','工'],['河','氵','可'],['海','氵','每'],['休','亻','木'],['体','亻','本'],['你','亻','尔'],['他','亻','也'],['们','亻','门'],['明','日','月'],['林','木','木'],['相','木','目'],['校','木','交'],['枝','木','支'],['村','木','寸'],['拍','扌','白'],['打','扌','丁'],['抱','扌','包'],['拉','扌','立'],['请','讠','青'],['说','讠','兑'],['话','讠','舌'],['语','讠','吾'],['情','忄','青'],['怕','忄','白'],['快','忄','夬'],['吗','口','马'],['鸣','口','鸟'],['听','口','斤'],['吹','口','欠'],['地','土','也'],['块','土','夬']].map(([answer,...parts])=>({answer,parts,layout:'horizontal'}));\nconst topBottom=[['安','宀','女'],['字','宀','子'],['宝','宀','玉'],['客','宀','各'],['花','艹','化'],['草','艹','早'],['苗','艹','田'],['雷','雨','田'],['星','日','生'],['早','日','十'],['思','田','心'],['男','田','力'],['尖','小','大'],['尘','小','土'],['岩','山','石'],['呆','口','木'],['杏','木','口'],['音','立','日'],['奇','大','可']].map(([answer,...parts])=>({answer,parts,layout:'vertical'}));\nconst state={running:false,phase:'idle',index:0,correct:0,errors:0,skips:0,started:0,itemStarted:0,frame:0,round:0,items:[],trials:[],records:[],composing:false,compositionEnded:-Infinity};\nfunction shuffle(values){const a=[...values];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction generateItems(){return shuffle([...shuffle(leftRight).slice(0,10),...shuffle(topBottom).slice(0,10)]);}\nfunction paint(){const answered=state.trials.length;$('time').textContent=Math.max(0,(performance.now()-state.started)/1000).toFixed(1);$('correct').textContent=String(state.correct);$('progress').style.width=(answered/20*100)+'%';}\nfunction tick(){if(!state.running)return;paint();state.frame=requestAnimationFrame(tick);}\nfunction enableInput(enabled){$('answerInput').disabled=!enabled;$('submit').disabled=!enabled;$('skip').disabled=!enabled;}\nfunction showQuestion(){state.phase='answering';state.composing=false;state.compositionEnded=-Infinity;const item=state.items[state.index];$('question').textContent=(state.index+1)+' / 20';$('fieldLabel').textContent=item.layout==='horizontal'?'左右结构 · 在脑中把部件合起来':'上下结构 · 在脑中把部件合起来';$('placeholder').hidden=true;$('parts').hidden=false;$('parts').className='parts'+(item.layout==='vertical'?' vertical':'');$('part0').textContent=item.parts[0];$('part1').textContent=item.parts[1];$('whole').hidden=true;$('whole').textContent='';$('caption').textContent='保持画面中的位置关系，认出完整汉字。';$('answerInput').value='';enableInput(true);$('next').hidden=true;$('feedback').className='feedback';$('feedback').textContent='先在心里说出完整汉字，再输入确认。';state.itemStarted=performance.now();$('answerInput').focus();}\nfunction start(){if(state.running)return;cancelAnimationFrame(state.frame);state.running=true;state.index=0;state.correct=0;state.errors=0;state.skips=0;state.trials=[];state.items=generateItems();state.started=performance.now();$('start').disabled=true;$('stop').disabled=false;$('result').hidden=true;$('review').hidden=true;$('reviewBody').replaceChildren();showQuestion();paint();state.frame=requestAnimationFrame(tick);}\nfunction submit(){if(!state.running||state.phase!=='answering'||state.composing)return;const value=$('answerInput').value.trim().normalize('NFKC');if(!/^[\\u3400-\\u9fff]$/.test(value)){$('feedback').className='feedback';$('feedback').textContent='请输入一个完整汉字，再提交。';$('answerInput').focus();return;}recordAnswer(value,false);}\nfunction skip(){if(state.running&&state.phase==='answering')recordAnswer('',true);}\nfunction recordAnswer(value,skipped){if(!state.running||state.phase!=='answering')return;const item=state.items[state.index];const correct=!skipped&&value===item.answer;const seconds=Math.max(0,(performance.now()-state.itemStarted)/1000);state.phase='feedback';state.composing=false;if(skipped)state.skips++;else if(correct)state.correct++;else state.errors++;state.trials.push({item,answer:value,kind:skipped?'skipped':correct?'correct':'wrong',seconds});enableInput(false);$('parts').hidden=true;$('whole').hidden=false;$('whole').textContent=item.answer;$('fieldLabel').textConten
