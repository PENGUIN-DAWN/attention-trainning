function todayKey(timestamp=Date.now()){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(timestamp));}
function buildDirectory(){modules.forEach((module,index)=>{const visual=visuals[index];const link=document.createElement('a');link.href='#train/'+module.id;link.className='orb-shell';link.id='orb'+module.id;link.setAttribute('aria-label','第'+module.id+'项，'+module.title+'，进入训练');for(const [key,value] of Object.entries(visual))link.style.setProperty('--'+key,value);link.style.setProperty('--accent',module.accent);link.innerHTML='<div class="orb-float"><div class="bubble"><span class="orb-number">0'+module.id+'</span><svg class="orb-icon" viewBox="0 0 64 64" aria-hidden="true">'+icons[index]+'</svg><h2>'+module.title+'</h2><p>'+module.short+'</p><span class="enter">进入训练 <span aria-hidden="true">↗</span></span><span class="visit-mark" aria-label="今日已完成">✓</span></div></div>';link.addEventListener('pointermove',event=>{if(event.pointerType==='touch')return;const bounds=link.getBoundingClientRect();link.style.setProperty('--mx',((event.clientX-bounds.left)/bounds.width-.5)*9+'px');link.style.setProperty('--my',((event.clientY-bounds.top)/bounds.height-.5)*9+'px');});link.addEventListener('pointerleave',()=>{link.style.setProperty('--mx','0px');link.style.setProperty('--my','0px');});$('bubbleField').appendChild(link);const tab=document.createElement('a');tab.className='module-tab';tab.href='#train/'+module.id;tab.innerHTML='<span>0'+module.id+'</span>'+module.title;tab.id='tab'+module.id;$('moduleTabs').appendChild(tab);});for(let i=0;i<6;i++)$('todayProgress').appendChild(document.createElement('i'));}
function updateToday(){const date=todayKey();const explored=new Set(records.filter(record=>todayKey(record.at)===date).map(record=>record.module));$('todayCount').textContent=explored.size+' / 6 项';modules.forEach((module,index)=>{$('orb'+module.id).classList.toggle('done',explored.has(module.id));$('todayProgress').children[index].className=explored.has(module.id)?'done':'';});$('todayHint').textContent=explored.size===6?'六颗气泡，都留下了今天的足迹。':explored.size?'已经完成 '+explored.size+' 项，也可以回到喜欢的那一项。':'选择一项，给自己一小段专注时间。';}
function showToast(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),3200);}
function trainingBridge(config){
 const session=(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
 const originalUnshift=state.records.unshift;
 state.records.unshift=function(...newRecords){const length=originalUnshift.apply(this,newRecords);for(const record of newRecords){const completed=config.id===1?['complete','timeout'].includes(record.reason):config.id===4?true:config.id===3?record.finished:record.completed;if(completed)queueMicrotask(()=>parent.postMessage({type:'focus:complete',module:config.id,token:session+':'+record.round,record:JSON.parse(JSON.stringify(record))},'*'));}return length;};
 window.addEventListener('message',event=>{if(event.source!==parent||event.data?.type!=='focus:suspend')return;if(config.id===4){if(!['idle','result'].includes(state.phase))abort('已返回目录，本组未计分。准备好后可重新开始。');}else if(state.running)finish('stopped');});
 parent.postMessage({type:'focus:ready',module:config.id},'*');
}
function moduleSource(module){const theme='<style>body{background:#f3f5ef;padding-top:25px}body>main>header{display:none}nav.links,a.back{display:none!important}:root{--hub-accent:'+module.accent+'}.primary{background:var(--hub-accent);border-color:var(--hub-accent)}main{max-width:1100px}.card,.side,.board-card{box-shadow:none}.foot{font-size:11px}@media(max-width:480px){body{padding:19px 12px}}</style>';const bridge='('+trainingBridge.toString()+')('+JSON.stringify({id:module.id})+');';return module.source.replace('</head>',theme+'</head>').replace('</body>','<script>'+bridge+'<'+'/script></body>');}
function getFrame(module){if(frames.has(module.id))return frames.get(module.id);const iframe=document.createElement('iframe');iframe.className='training-frame';iframe.title='第'+module.id+'项：'+module.title;iframe.setAttribute('sandbox','allow-scripts allow-same-origin');iframe.hidden=true;iframe.srcdoc=moduleSource(module);iframe.addEventListener('load',()=>{if(activeModule===module.id)$('frameLoading').hidden=true;});frames.set(module.id,iframe);$('frameHost').appendChild(iframe);return iframe;}
function route(){const match=location.hash.match(/^#train\/([1-6])$/);const id=match?Number(match[1]):null;if(activeModule!==null&&activeModule!==id){const previous=frames.get(activeModule);previous?.contentWindow?.postMessage({type:'focus:suspend'},'*');}activeModule=id;for(const [frameId,iframe]of frames)iframe.hidden=frameId!==id;if(id===null){$('homeView').hidden=false;$('playView').hidden=true;document.title='专注力小宇宙 · 六种练习，一个轻盈的开始';updateToday();return;}const module=modules.find(module=>module.id===id);$('homeView').hidden=true;$('playView').hidden=false;$('playView').style.setProperty('--module-accent',module.accent);$('playView').style.setProperty('--module-bg',visuals[id-1].color);$('playNumber').textContent='0'+id;$('playTitle').textContent=module.title;$('playDescription').textContent=module.description;document.title=module.title+' · 专注力小宇宙';$('nextModule').href=id<6?'#train/'+(id+1):'#home';$('nextModule').innerHTML=id<6?'下一项 <span aria-hidden="true">→</span>':'返回目录 <span aria-hidden="true">↗</span>';modules.forEach(item=>{const tab=$('tab'+item.id);tab.classList.toggle('active',item.id===id);if(item.id===id)tab.setAttribute('aria-current','page');else tab.removeAttribute('aria-current');});const existing=frames.has(id);$('frameLoading').hidden=existing;getFrame(module).hidden=false;window.scrollTo({top:0,behavior:'instant'});}
function summaryFor(id,record){const number=value=>Number.isFinite(Number(value))?Number(value):0;if(id===1)return '找到 '+number(record.found)+'/25 · '+number(record.seconds).toFixed(1)+' 秒 · 点错 '+number(record.errors)+' 次';if(id===3)return '一次排对 '+number(record.perfect)+'/'+number(record.completed)+' 题 · 点错 '+number(record.errors)+' 次';if(id===4)return '位置记对 '+number(record.correct)+'/6 项 · 每项 '+(number(record.duration)/1000).toFixed(1)+' 秒';if(id===5)return '答对 '+number(record.correct)+'/'+number(record.answered)+' 题 · 观察 '+(number(record.observationMs)/1000).toFixed(1)+' 秒';return '答对 '+number(record.correct)+'/'+number(record.answered)+' 题 · '+(id===6?'跳过 '+number(record.skips)+' 题':'答错 '+number(record.errors)+' 题');}
window.addEventListener('message',event=>{const message=event.data;if(!message||!Number.isInteger(message.module))return;const frame=frames.get(message.module);if(!frame||event.source!==frame.contentWindow)return;if(message.type==='focus:ready'){if(activeModule===message.module)$('frameLoading').hidden=true;return;}if(message.type!=='focus:complete'||typeof message.token!=='string'||!message.record||records.some(record=>record.token===message.token))return;const item={module:message.module,token:message.token,at:Date.now(),summary:summaryFor(message.module,message.record)};records.unshift(item);records=records.slice(0,200);try{localStorage.setItem(STORAGE_KEY,JSON.stringify(records));}catch{}updateToday();showToast('完成一轮 '+modules[message.module-1].title+'，留下了一枚小小的足迹。');});
function showRecords(){const list=$('recordsList');list.replaceChildren();if(!records.length){const empty=document.createElement('div');empty.className='empty-records';empty.innerHTML='<svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><circle cx="16" cy="18" r="8"/><circle cx="32" cy="31" r="10"/><path d="m27 10 2-6 2 6 6 2-6 2-2 6-2-6-6-2Z"/></svg>第一枚足迹，还在等你。<br>完成任意一项的一轮练习，就会出现在这里。';list.appendChild(empty);}else for(const record of records.slice(0,20)){const module=modules[record.module-1];const row=document.createElement('div');row.className='record-row';const badge=document.createElement('span');badge.className='record-badge';badge.style.background=visuals[record.module-1].color;badge.style.color=module.accent;badge.textContent='0'+module.id;const body=document.createElement('div');const title=document.createElement('div');title.className='record-title';title.textContent=module.title;const info=document.createElement('div');info.className='record-info';info.textContent=record.summary;body.append(title,info);const date=document.createElement('span');date.className='record-date';date.textContent=new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(record.at));row.append(badge,body,date);list.appendChild(row);}$('recordsDialog').showModal();}
$('recordsButton').addEventListener('click',showRecords);$('closeRecords').addEventListener('click',()=>$('recordsDialog').close());$('recordsDialog').addEventListener('click',event=>{if(event.target!==$('recordsDialog'))return;const rect=$('recordsDialog').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)$('recordsDialog').close();});window.addEventListener('hashchange',route);window.addEventListener('pageshow',updateToday);buildDirectory();updateToday();route();
</script>
